<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123c69">
  <title>フォレスタ進捗管理</title>
  <link rel="stylesheet" href="foresta.css?v=1">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="./foresta.html" aria-label="フォレスタ進捗管理 ホーム">
      <span class="brand-mark">F</span>
      <span><b>フォレスタ進捗管理</b><small>通常授業・学校先取り</small></span>
    </a>
    <div class="header-actions">
      <span id="sessionName" class="session-name"></span>
      <a class="subtle-button" href="./">ステップ＆ゴールへ</a>
      <button id="logoutButton" class="subtle-button hidden" type="button">ログアウト</button>
    </div>
  </header>

  <main id="app" class="page-shell" aria-live="polite">
    <section class="login-layout">
      <div class="login-copy">
        <span class="kicker">FORESTA PREVIEW TRACKER</span>
        <h1>学校より、一歩先へ。</h1>
        <p>学校進度・テスト予定・毎回の宿題・クリアテストを、ひとつの流れで管理します。</p>
        <div class="principles">
          <span>学校進度より先を学習</span><span>テスト2週間前に予想範囲を完了</span><span>完了後は範囲を反復</span>
        </div>
      </div>
      <form id="loginForm" class="login-card">
        <div class="role-switch" role="group" aria-label="ログイン区分">
          <label><input type="radio" name="loginRole" value="student" checked><span>生徒</span></label>
          <label><input type="radio" name="loginRole" value="staff"><span>講師・管理者</span></label>
        </div>
        <label><span id="loginIdLabel">生徒ID</span><input id="loginId" autocomplete="username" required></label>
        <label><span>パスワード</span><input id="loginPassword" type="password" autocomplete="current-password" required></label>
        <button id="loginButton" class="primary-button" type="submit">ログイン</button>
        <p id="loginMessage" class="form-message" role="alert"></p>
      </form>
    </section>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="foresta.js?v=3"></script>
</body>
</html>
