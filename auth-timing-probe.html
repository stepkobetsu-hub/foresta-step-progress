<!doctype html><meta charset="utf-8"><label>ID <input id="id"></label><label>Password <input id="pw" type="password"></label><button id="run">Run</button><pre id="out"></pre><script>const API='https://script.google.com/macros/s/AKfycbwu8lfhiH3_7m4ogHNtbgeo3ehx_VBMnt1mPXsvIlL_kMSpxFdrRD4rO_I6q_JUXIWHmg/exec';run.onclick=async()=>{const t=performance.now(),r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'studentLogin',studentId:id.value,password:pw.value}),cache:'no-store'}),j=await r.json();out.textContent=JSON.stringify({roundTripMs:Math.round(performance.now()-t),success:j.success,timing:j._timing})}</script>
