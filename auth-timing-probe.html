<!doctype html><meta charset="utf-8"><title>Auth timing probe</title><label>ID <input id="id"></label><label>Password <input id="pw" type="password"></label><button id="run">Run</button><pre id="out"></pre><script>const API='https://script.google.com/macros/s/AKfycbwu8lfhiH3_7m4ogHNtbgeo3ehx_VBMnt1mPXsvIlL_kMSpxFdrRD4rO_I6q_JUXIWHmg/exec';document.getElementById('run').onclick=async()=>{const t=performance.now();const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'studentLogin',studentId:document.getElementById('id').value,password:document.getElementById('pw').value}),cache:'no-store',redirect:'follow'});const j=await r.json();document.getElementById('out').textContent=JSON.stringify({roundTripMs:Math.round(performance.now()-t),success:j.success,timing:j._timing},null,2)};</script>
