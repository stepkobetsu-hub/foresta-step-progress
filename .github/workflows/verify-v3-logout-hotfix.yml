name: Verify V3 logout hotfix

on:
  push:
    branches:
      - main
    paths:
      - .verify-v3-logout-hotfix-trigger

permissions:
  contents: write

concurrency:
  group: verify-v3-logout-hotfix
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Wait for production hotfix and verify health
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 60); do
            url="https://step-progress-api.stepkobetsu.workers.dev/?logout-hotfix-verify=${GITHUB_RUN_ID}-${attempt}"
            if curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$url" -o /tmp/index.html; then
              if grep -q "forestaProgress.manualLogout" /tmp/index.html \
                && grep -q "setLoginType('student');finishAuthResume_();button.disabled=false" /tmp/index.html; then
                curl --fail --silent --show-error -H 'Cache-Control: no-cache' https://step-progress-api.stepkobetsu.workers.dev/health -o /tmp/health.json
                node -e 'const h=require("/tmp/health.json"); process.exit(h.ok===true && h.mode==="d1-isolated-autosave" ? 0 : 1)'
                found=1
                break
              fi
            fi
            sleep 10
          done
          if [ "$found" -ne 1 ]; then
            echo 'Production logout hotfix marker was not found'
            exit 1
          fi

      - name: Record verification result
        if: always()
        shell: bash
        env:
          VERIFY_STATUS: ${{ job.status }}
          VERIFY_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '%s run=%s checked=%s\n' "$VERIFY_STATUS" "$VERIFY_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .verify-v3-logout-hotfix-result
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .verify-v3-logout-hotfix-result
          git commit -m "Record V3 logout hotfix verification: $VERIFY_STATUS" || exit 0
          git push origin HEAD:main
