name: Deploy step-progress homework check cloud reliability

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-step-progress.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step-progress-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EXPECTED_LIVE_HTML_SHA256: 3a248ee89f3a105fc4bedff3d3abeaacfd7791f38eadee5fa42f9e1388304cc5
      EXPECTED_DEPLOYED_HTML_SHA256: fa4be31596b9cb63a38f1522b6df1f7f7e7cf83420329fe4ac53c5daad841dbf
    steps:
      - name: Require Cloudflare secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }

      - name: Check out the reviewed hotfix
        uses: actions/checkout@v4
        with:
          ref: agent/cloudflare-progress-migration

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Preserve the UI and strengthen homework check cloud saves
        working-directory: cloudflare
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://step-progress-api.stepkobetsu.workers.dev/ \
            --output public/index.html
          CURRENT_HTML_SHA256="$(sha256sum public/index.html | cut -d' ' -f1)"
          if [ "$CURRENT_HTML_SHA256" != "$EXPECTED_LIVE_HTML_SHA256" ] && \
             [ "$CURRENT_HTML_SHA256" != "$EXPECTED_DEPLOYED_HTML_SHA256" ]; then
            echo "Unexpected production UI hash: $CURRENT_HTML_SHA256"
            exit 1
          fi
          node scripts/apply-homework-archive-persistence.mjs public/index.html
          node scripts/apply-target-cloud-reliability.mjs public/index.html
          node scripts/apply-homework-check-reliability.mjs public/index.html
          echo "$EXPECTED_DEPLOYED_HTML_SHA256  public/index.html" | sha256sum --check

      - name: Verify the hotfix
        working-directory: cloudflare
        shell: bash
        run: |
          npm run check
          node --test \
            tests/browser-api-consistency.test.mjs \
            tests/dashboard.test.mjs \
            tests/homework-archive-persistence.test.mjs \
            tests/homework-check-reliability.test.mjs \
            tests/summary.test.mjs \
            tests/target-cloud-reliability.test.mjs \
            tests/write-guard.test.mjs

      - name: Deploy to production
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.jsonc --keep-vars --message "Persist homework checks after Google cloud save"

      - name: Verify production health and homework cloud-save UI
        shell: bash
        run: |
          curl --fail --silent --show-error \
            https://step-progress-api.stepkobetsu.workers.dev/health \
            | tee /tmp/health.json
          node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync("/tmp/health.json","utf8")); if(h.ok!==true) process.exit(1)'
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              https://step-progress-api.stepkobetsu.workers.dev/ \
              --output /tmp/production-index.html
            CURRENT_HTML_SHA256="$(sha256sum /tmp/production-index.html | cut -d' ' -f1)"
            if [ "$CURRENT_HTML_SHA256" = "$EXPECTED_DEPLOYED_HTML_SHA256" ]; then
              break
            fi
            sleep 5
          done
          echo "$EXPECTED_DEPLOYED_HTML_SHA256  /tmp/production-index.html" | sha256sum --check
