name: Deploy step-progress homework archive persistence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-step-progress.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step-progress-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EXPECTED_LIVE_HTML_SHA256: 36f423466da8569fb29b6df1ee0957a1cf90972b82d478a3986e5267cbed394a
      EXPECTED_DEPLOYED_HTML_SHA256: 2f9ad7ad841b87edd7f1113af5555f290d5cd811446369d6d505cc1d0318946d
    steps:
      - name: Require Cloudflare secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }

      - name: Check out the reviewed hotfix
        uses: actions/checkout@v4
        with:
          ref: agent/cloudflare-progress-migration

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Preserve the UI and add persistent homework archives
        working-directory: cloudflare
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://step-progress-api.stepkobetsu.workers.dev/ \
            --output public/index.html
          CURRENT_HTML_SHA256="$(sha256sum public/index.html | cut -d' ' -f1)"
          if [ "$CURRENT_HTML_SHA256" != "$EXPECTED_LIVE_HTML_SHA256" ] && \
             [ "$CURRENT_HTML_SHA256" != "$EXPECTED_DEPLOYED_HTML_SHA256" ]; then
            echo "Unexpected production UI hash: $CURRENT_HTML_SHA256"
            exit 1
          fi
          node scripts/apply-homework-archive-persistence.mjs public/index.html
          echo "$EXPECTED_DEPLOYED_HTML_SHA256  public/index.html" | sha256sum --check

      - name: Verify the hotfix
        working-directory: cloudflare
        shell: bash
        run: |
          npm run check
          node --test \
            tests/browser-api-consistency.test.mjs \
            tests/dashboard.test.mjs \
            tests/homework-archive-persistence.test.mjs \
            tests/summary.test.mjs \
            tests/write-guard.test.mjs

      - name: Deploy to production
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.jsonc --keep-vars --message "Persist homework archives across logins"

      - name: Verify production health and archive persistence UI
        shell: bash
        run: |
          curl --fail --silent --show-error \
            https://step-progress-api.stepkobetsu.workers.dev/health \
            | tee /tmp/health.json
          node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync("/tmp/health.json","utf8")); if(h.ok!==true) process.exit(1)'
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              https://step-progress-api.stepkobetsu.workers.dev/ \
              --output /tmp/production-index.html
            CURRENT_HTML_SHA256="$(sha256sum /tmp/production-index.html | cut -d' ' -f1)"
            if [ "$CURRENT_HTML_SHA256" = "$EXPECTED_DEPLOYED_HTML_SHA256" ]; then
              break
            fi
            sleep 5
          done
          echo "$EXPECTED_DEPLOYED_HTML_SHA256  /tmp/production-index.html" | sha256sum --check
