name: Fix production truncated prefix

on:
  push:
    branches:
      - agent/step-progress-v3-implementation
    paths:
      - .github/workflows/fix-production-truncated-prefix.yml

permissions:
  contents: write

concurrency:
  group: fix-production-truncated-prefix
  cancel-in-progress: false

jobs:
  repair-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out V3 implementation
        uses: actions/checkout@v4
        with:
          ref: agent/step-progress-v3-implementation

      - name: Remove accidental connector warning prefix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('cloudflare/public/index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<!doctype html>'
          pos = text.lower().find(marker)
          if pos < 0:
              raise SystemExit('DOCTYPE marker not found')
          cleaned = text[pos:]
          path.write_text(cleaned, encoding='utf-8')
          if not cleaned.lower().startswith(marker):
              raise SystemExit('repair failed')
          if 'homeDoneCheckbox' not in cleaned:
              raise SystemExit('homework checkbox patch missing')
          print('Repaired index prefix and preserved checkbox patch')
          PY
          head -n 2 cloudflare/public/index.html

      - name: Commit repaired source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-production-truncated-prefix.yml
          git config user.name 'stepkobetsu-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare/public/index.html .github/workflows/fix-production-truncated-prefix.yml
          git commit -m 'Repair production HTML truncated warning prefix'
          git push origin HEAD:agent/step-progress-v3-implementation

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify TypeScript
        working-directory: cloudflare
        run: npm run check

      - name: Deploy production Worker
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.v3.production.jsonc --message 'Repair production HTML and keep homework checkbox'

      - name: Verify production UI
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            curl --fail --silent --show-error -H 'Cache-Control: no-cache' 'https://step-progress-api.stepkobetsu.workers.dev/?repair=20260828' -o /tmp/index.html
            if head -c 15 /tmp/index.html | grep -qi '<!doctype html>' && ! head -n 2 /tmp/index.html | grep -q 'Warning: truncated output' && grep -q 'homeDoneCheckbox' /tmp/index.html; then
              echo 'Production UI repaired and checkbox present'
              exit 0
            fi
            sleep 3
          done
          echo 'Production verification failed' >&2
          head -n 5 /tmp/index.html >&2 || true
          exit 1
