name: Verify multi-student graph speed

on:
  push:
    branches: [main]
    paths:
      - '.verify-multi-student-graph-speed'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/homework-status-root-cause
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Benchmark sample students
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          PROBE_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$PROBE_TOKEN"
          cat > src/multi-speed-probe.ts <<'TS'
          type Env={DB:D1Database;PROBE_TOKEN:string};
          const hash=async(token:string)=>{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(token));return Array.from(new Uint8Array(d),b=>b.toString(16).padStart(2,'0')).join('')};
          export default {async fetch(req:Request,env:Env){
            const supplied=(req.headers.get('authorization')||'').replace(/^Bearer\s+/i,'');
            if(!env.PROBE_TOKEN||supplied!==env.PROBE_TOKEN)return new Response('not found',{status:404});
            const url=new URL(req.url),studentId=(url.searchParams.get('studentId')||'').trim();
            if(!studentId)return new Response('studentId required',{status:400});
            const token=`speed-${studentId}-${crypto.randomUUID()}-${crypto.randomUUID()}`;
            const digest=await hash(token);
            const expires=new Date(Date.now()+10*60*1000).toISOString();
            await env.DB.prepare(`INSERT INTO v3_sessions(token_hash,user_id,role,profile_json,expires_at,created_at,last_seen_at) VALUES(?,?,'STUDENT',?,datetime(?),datetime('now'),datetime('now'))`).bind(digest,studentId,JSON.stringify({studentId,id:studentId}),expires).run();
            return new Response(JSON.stringify({token}),{headers:{'content-type':'application/json','cache-control':'no-store'}});
          }} satisfies ExportedHandler<Env>;
          TS
          PROBE_TOKEN="$PROBE_TOKEN" node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('wrangler.multi-speed-probe.json',JSON.stringify({
            name:'step-progress-v3-multi-speed-probe',main:'src/multi-speed-probe.ts',compatibility_date:'2026-08-23',compatibility_flags:['nodejs_compat'],
            vars:{PROBE_TOKEN:process.env.PROBE_TOKEN},
            d1_databases:[{binding:'DB',database_name:'step-progress-db',database_id:'028f097c-2609-4bf7-9e9b-39b565606941'}]
          },null,2));
          NODE
          npx wrangler deploy --config wrangler.multi-speed-probe.json --message "Temporary protected multi-student graph speed probe"
          for attempt in $(seq 1 12); do
            code=$(curl --silent --show-error -o /tmp/probe-ready -w '%{http_code}' -H "Authorization: Bearer $PROBE_TOKEN" 'https://step-progress-v3-multi-speed-probe.stepkobetsu.workers.dev/?studentId=1100' || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ] || exit 1
          for student in 1100 1097 1214 1276 1312; do
            curl --fail --silent --show-error -H "Authorization: Bearer $PROBE_TOKEN" "https://step-progress-v3-multi-speed-probe.stepkobetsu.workers.dev/?studentId=$student" -o "/tmp/session-$student.json"
            SESSION_TOKEN="$(node -p "require('/tmp/session-$student.json').token")"
            echo "::add-mask::$SESSION_TOKEN"
            printf '{"action":"getStudentDashboard","token":"%s"}' "$SESSION_TOKEN" > "/tmp/request-$student.json"
            echo "--- student $student ---"
            curl --silent --show-error --output "/tmp/dashboard-$student.json" \
              --write-out 'http=%{http_code} total=%{time_total}s starttransfer=%{time_starttransfer}s size=%{size_download}B\n' \
              -H 'Content-Type: text/plain;charset=utf-8' --data-binary @"/tmp/request-$student.json" \
              https://step-progress-api.stepkobetsu.workers.dev/api
            node -e "const d=require('/tmp/dashboard-$student.json'); console.log({student:'$student',success:d.success,overall:d.data?.overall,units:d.data?.units?.length,selectable:d.data?.selectableUnits?.length})"
          done
