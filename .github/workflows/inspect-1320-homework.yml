name: Inspect 1320 homework persistence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/trigger-inspect-1320-homework'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step-progress-v3-implementation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Deploy protected inspector and read recent 1320 rows
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          SMOKE_TOKEN="$TOKEN" node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('wrangler.v3-smoke.template.jsonc','utf8'));
          c.vars.SMOKE_TOKEN=process.env.SMOKE_TOKEN;
          fs.writeFileSync('wrangler.v3-smoke.generated.json',JSON.stringify(c,null,2));
          NODE
          npx wrangler deploy --config wrangler.v3-smoke.generated.json --message "Temporary protected 1320 persistence inspector"
          rm -f /tmp/inspect.json
          for attempt in $(seq 1 10); do
            code=$(curl --silent --show-error -o /tmp/inspect.json -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -d '{"action":"inspectRecent1320"}' \
              https://step-progress-v3-smoke.stepkobetsu.workers.dev || true)
            if [ "$code" = "200" ]; then break; fi
            echo "Inspector not ready yet: HTTP $code attempt $attempt"
            sleep 3
          done
          node - <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('/tmp/inspect.json','utf8');
          const d=JSON.parse(raw);
          if(d.ok!==true) throw new Error(raw);
          console.log('RECENT_OVERRIDES');
          for (const r of d.overrides||[]) console.log(JSON.stringify(r));
          console.log('RECENT_SNAPSHOT');
          for (const r of d.snapshot||[]) console.log(JSON.stringify(r));
          NODE
