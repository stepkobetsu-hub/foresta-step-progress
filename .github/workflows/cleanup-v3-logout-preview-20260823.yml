name: Cleanup V3 logout preview 20260823

on:
  push:
    branches: [main]
    paths:
      - '.cleanup-v3-logout-preview-trigger'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Delete temporary preview Worker
        run: npx --yes wrangler@4.125.0 delete --name step-progress-v3-logout-hotfix-preview --force
