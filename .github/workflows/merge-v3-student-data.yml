name: Merge preserved student data into V3

on:
  pull_request:
    branches:
      - agent/step-progress-v3-implementation
    paths:
      - .v3-data-merge-trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step-progress-v3-data-merge
  cancel-in-progress: false

jobs:
  merge:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'codex/homework-status-root-cause'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out current V3/Codex branch
        uses: actions/checkout@v4
        with:
          ref: codex/homework-status-root-cause

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: TypeScript check
        working-directory: cloudflare
        run: npm run check

      - name: Deploy protected merge helper
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "MERGE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          MERGE_TOKEN="$TOKEN" node - <<'NODE'
          const fs=require('fs');
          const config={
            $schema:'node_modules/wrangler/config-schema.json',
            name:'step-progress-v3-data-merge',
            main:'src/v3-data-merge.ts',
            compatibility_date:'2026-08-22',
            compatibility_flags:['nodejs_compat'],
            vars:{MERGE_TOKEN:process.env.MERGE_TOKEN},
            d1_databases:[{
              binding:'DB',
              database_name:'step-progress-db',
              database_id:'028f097c-2609-4bf7-9e9b-39b565606941'
            }]
          };
          fs.writeFileSync('wrangler.v3-data-merge.generated.json',JSON.stringify(config,null,2));
          NODE
          npx wrangler deploy --config wrangler.v3-data-merge.generated.json --message "One-shot protected legacy-to-V3 student data merge"

      - name: Merge and verify preserved student data
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const url='https://step-progress-v3-data-merge.stepkobetsu.workers.dev';
          const token=process.env.MERGE_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let data=null;
          for(let attempt=1;attempt<=10;attempt++){
            const response=await fetch(url,{
              method:'POST',
              headers:{'content-type':'application/json',authorization:`Bearer ${token}`},
              body:JSON.stringify({action:'merge'})
            });
            if(response.status===404){await sleep(2000);continue;}
            data=await response.json();
            if(!response.ok)throw new Error(`HTTP ${response.status}: ${JSON.stringify(data)}`);
            break;
          }
          if(!data)throw new Error('merge helper did not become ready');
          if(data.ok!==true)throw new Error(JSON.stringify(data));
          if(data.missing?.progress!==0||data.missing?.targets!==0||data.missing?.homework!==0)throw new Error(`legacy rows still missing: ${JSON.stringify(data.missing)}`);
          if(!data.checks?.backupOk||!data.checks?.sourceUntouched||!data.checks?.overridesUntouched||!data.checks?.noMissing||!data.checks?.nonDecreasing)throw new Error(`merge checks failed: ${JSON.stringify(data.checks)}`);
          console.log('MERGE_RESULT '+JSON.stringify(data));
          NODE
