name: Diagnose step-progress V3 cutover

on:
  pull_request:
    branches: [main]
    paths:
      - V3_CUTOVER_DIAGNOSTIC_TRIGGER.md

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler only
        run: npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@4.125.0

      - name: Read current public states
        shell: bash
        run: |
          set +e
          echo '=== PRODUCTION HEALTH ==='
          curl --silent --show-error -H 'Cache-Control: no-cache' https://step-progress-api.stepkobetsu.workers.dev/health
          echo
          echo '=== STAGING HEALTH ==='
          curl --silent --show-error -H 'Cache-Control: no-cache' https://step-progress-v3-staging.stepkobetsu.workers.dev/health
          echo
          echo '=== V3 SNAPSHOT STATUS ==='
          curl --silent --show-error -H 'Cache-Control: no-cache' https://step-progress-v3-smoke.stepkobetsu.workers.dev/status
          echo

      - name: Read current Cloudflare production deployment
        shell: bash
        run: |
          set +e
          echo '=== DEPLOYMENT STATUS ==='
          npx wrangler deployments status --name step-progress-api --json
          echo
          echo '=== RECENT VERSIONS ==='
          npx wrangler versions list --name step-progress-api --json
          echo
          exit 0
