name: Verify teacher logout 20260824

on:
  pull_request:
    branches: [main]
    paths:
      - '.fix-refresh-session-graph-trigger'

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LAST_GOOD_UI_URL: https://7b84a8f6-step-progress-api.stepkobetsu.workers.dev/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/homework-status-root-cause
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: cloudflare
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build candidate
        working-directory: cloudflare
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$LAST_GOOD_UI_URL" -o public/index.html
          node scripts/apply-v3-runtime-fastpath.mjs src/v3.ts
          node scripts/apply-v3-autosave.mjs public/index.html
          node scripts/apply-v3-homework-display-fix.mjs src/v3.ts public/index.html
          npm run check
          grep -q "v3-hard-logout-to-student-login" public/index.html
          grep -q "forestaProgress.explicitLogout" public/index.html
          grep -q "setLoginType('student')" public/index.html
          grep -q "renderProgressHeroFast_(out.data)" public/index.html
      - name: Deploy preview
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.v3.production.jsonc --name step-progress-v3-logout-fix-preview --message "Preview teacher logout to student login"
      - name: Create protected teacher test session
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          PROBE_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$PROBE_TOKEN"
          cat > src/logout-session-probe.ts <<'TS'
          type Env={DB:D1Database;PROBE_TOKEN:string};
          const hash=async(token:string)=>{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(token));return Array.from(new Uint8Array(d),b=>b.toString(16).padStart(2,'0')).join('')};
          export default {async fetch(req:Request,env:Env){
            const supplied=(req.headers.get('authorization')||'').replace(/^Bearer\s+/i,'');
            if(!env.PROBE_TOKEN||supplied!==env.PROBE_TOKEN)return new Response('not found',{status:404});
            const token=`teacher-logout-${crypto.randomUUID()}-${crypto.randomUUID()}`;
            const digest=await hash(token),expires=new Date(Date.now()+30*60*1000).toISOString();
            const profile={code:'logout-probe',name:'検証講師'};
            await env.DB.prepare(`INSERT INTO v3_sessions(token_hash,user_id,role,profile_json,expires_at,created_at,last_seen_at) VALUES(?,?,'TEACHER',?,datetime(?),datetime('now'),datetime('now'))`).bind(digest,'logout-probe',JSON.stringify(profile),expires).run();
            return new Response(JSON.stringify({token,expiresAt:expires}),{headers:{'content-type':'application/json','cache-control':'no-store'}});
          }} satisfies ExportedHandler<Env>;
          TS
          PROBE_TOKEN="$PROBE_TOKEN" node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('wrangler.logout-session-probe.json',JSON.stringify({name:'step-progress-v3-logout-session-probe',main:'src/logout-session-probe.ts',compatibility_date:'2026-08-24',compatibility_flags:['nodejs_compat'],vars:{PROBE_TOKEN:process.env.PROBE_TOKEN},d1_databases:[{binding:'DB',database_name:'step-progress-db',database_id:'028f097c-2609-4bf7-9e9b-39b565606941'}]},null,2));
          NODE
          npx wrangler deploy --config wrangler.logout-session-probe.json --message "Temporary protected teacher logout probe"
          code=000
          for attempt in $(seq 1 12); do
            code=$(curl --silent --show-error -o /tmp/session.json -w '%{http_code}' -H "Authorization: Bearer $PROBE_TOKEN" https://step-progress-v3-logout-session-probe.stepkobetsu.workers.dev/ || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ] || exit 1
          echo "SESSION_TOKEN=$(node -p "require('/tmp/session.json').token")" >> "$GITHUB_ENV"
          echo "EXPIRES_AT=$(node -p "require('/tmp/session.json').expiresAt")" >> "$GITHUB_ENV"
      - name: Verify preview teacher logout
        working-directory: cloudflare
        run: |
          echo "::add-mask::$SESSION_TOKEN"
          TARGET_URL=https://step-progress-v3-logout-fix-preview.stepkobetsu.workers.dev/ node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true}),page=await browser.newPage();
            const url=process.env.TARGET_URL;
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            await page.evaluate(({token,expiresAt})=>{
              const value={token,role:'TEACHER',profile:{code:'logout-probe',name:'検証講師'},expiresAt};
              sessionStorage.setItem('fsSession',JSON.stringify(value));
              localStorage.setItem('forestaProgress.rememberedSession',JSON.stringify(value));
              localStorage.setItem('forestaProgress.rememberLogin.staff','true');
              localStorage.setItem('forestaProgress.savedId.staff','remembered-teacher');
              localStorage.setItem('forestaProgress.savedPassword.staff','remembered-password');
              localStorage.removeItem('forestaProgress.explicitLogout');
            },{token:process.env.SESSION_TOKEN,expiresAt:process.env.EXPIRES_AT});
            await page.reload({waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>!document.getElementById('application').classList.contains('hidden'),null,{timeout:5000});
            await page.locator('#logout').click();
            await page.waitForFunction(()=>{
              const login=document.getElementById('login'),app=document.getElementById('application');
              return !login.classList.contains('hidden')&&app.classList.contains('hidden')&&document.body.innerText.includes('生徒ログイン');
            },null,{timeout:1500});
            let state=await page.evaluate(()=>({
              explicit:localStorage.getItem('forestaProgress.explicitLogout'),
              remembered:localStorage.getItem('forestaProgress.rememberLogin.staff'),
              rememberedId:localStorage.getItem('forestaProgress.savedId.staff'),
              stored:sessionStorage.getItem('fsSession'),
              common:localStorage.getItem('stepCommonStudentSessionToken'),
              studentActive:document.getElementById('studentTab').classList.contains('active'),
              appHidden:document.getElementById('application').classList.contains('hidden'),
              loginHidden:document.getElementById('login').classList.contains('hidden')
            }));
            console.log('LOGOUT_STATE='+JSON.stringify(state));
            if(state.explicit!=='1'||state.remembered!=='true'||state.rememberedId!=='remembered-teacher'||state.stored||state.common||!state.studentActive||!state.appHidden||state.loginHidden)throw new Error('logout state invalid');
            await page.reload({waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(1200);
            const after=await page.evaluate(()=>({
              appHidden:document.getElementById('application').classList.contains('hidden'),
              loginHidden:document.getElementById('login').classList.contains('hidden'),
              text:document.body.innerText.slice(0,1000),
              explicit:localStorage.getItem('forestaProgress.explicitLogout')
            }));
            console.log('AFTER_RELOAD='+JSON.stringify(after));
            if(!after.appHidden||after.loginHidden||!after.text.includes('生徒ログイン')||after.explicit!=='1')throw new Error('teacher auto-resumed after explicit logout');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Deploy production
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.v3.production.jsonc --message "Fix teacher logout blank screen and return to student login"
      - name: Verify production teacher logout
        working-directory: cloudflare
        run: |
          echo "::add-mask::$SESSION_TOKEN"
          sleep 5
          TARGET_URL=https://step-progress-api.stepkobetsu.workers.dev/ node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true}),page=await browser.newPage();
            await page.goto(process.env.TARGET_URL,{waitUntil:'domcontentloaded',timeout:30000});
            await page.evaluate(({token,expiresAt})=>{
              const value={token,role:'TEACHER',profile:{code:'logout-probe',name:'検証講師'},expiresAt};
              sessionStorage.setItem('fsSession',JSON.stringify(value));
              localStorage.setItem('forestaProgress.rememberedSession',JSON.stringify(value));
              localStorage.setItem('forestaProgress.rememberLogin.staff','true');
              localStorage.setItem('forestaProgress.savedId.staff','remembered-teacher');
              localStorage.setItem('forestaProgress.savedPassword.staff','remembered-password');
              localStorage.removeItem('forestaProgress.explicitLogout');
            },{token:process.env.SESSION_TOKEN,expiresAt:process.env.EXPIRES_AT});
            await page.reload({waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>!document.getElementById('application').classList.contains('hidden'),null,{timeout:8000});
            await page.locator('#logout').click();
            await page.waitForFunction(()=>!document.getElementById('login').classList.contains('hidden')&&document.getElementById('application').classList.contains('hidden')&&document.body.innerText.includes('生徒ログイン'),null,{timeout:2000});
            console.log('PRODUCTION_LOGOUT_TO_STUDENT_MS=OK');
            await page.reload({waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(1200);
            const after=await page.evaluate(()=>({appHidden:document.getElementById('application').classList.contains('hidden'),loginHidden:document.getElementById('login').classList.contains('hidden'),text:document.body.innerText.slice(0,1000),explicit:localStorage.getItem('forestaProgress.explicitLogout')}));
            console.log('PRODUCTION_AFTER_RELOAD='+JSON.stringify(after));
            if(!after.appHidden||after.loginHidden||!after.text.includes('生徒ログイン')||after.explicit!=='1')throw new Error('production explicit logout did not persist');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          curl --fail --silent --show-error https://step-progress-api.stepkobetsu.workers.dev/health -o /tmp/health.json
          cat /tmp/health.json
          node -e 'const h=require("/tmp/health.json");process.exit(h.ok===true&&h.progressCount===3540&&h.targetCount===6555&&h.homeworkCount===2271?0:1)'
