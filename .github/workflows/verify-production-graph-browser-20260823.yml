name: Verify production graph browser 20260823

on:
  pull_request:
    branches: [main]
    paths:
      - '.verify-production-graph-browser-trigger'

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/homework-status-root-cause
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        working-directory: cloudflare
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify production asset contains immediate graph patch
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' https://step-progress-api.stepkobetsu.workers.dev/ -o /tmp/current-index.html
          grep -q "renderProgressHeroFast_(out.data)" /tmp/current-index.html
          grep -q "done?'宿題済み':'チェック'" /tmp/current-index.html
      - name: Create protected production test session
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          PROBE_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$PROBE_TOKEN"
          cat > src/browser-session-probe.ts <<'TS'
          type Env={DB:D1Database;PROBE_TOKEN:string};
          const hash=async(token:string)=>{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(token));return Array.from(new Uint8Array(d),b=>b.toString(16).padStart(2,'0')).join('')};
          export default {async fetch(req:Request,env:Env){
            const supplied=(req.headers.get('authorization')||'').replace(/^Bearer\s+/i,'');
            if(!env.PROBE_TOKEN||supplied!==env.PROBE_TOKEN)return new Response('not found',{status:404});
            const token=`browser-1100-${crypto.randomUUID()}-${crypto.randomUUID()}`;
            const digest=await hash(token),expires=new Date(Date.now()+20*60*1000).toISOString();
            const profile={studentId:'1100',id:'1100',name:'田中彗翔'};
            await env.DB.prepare(`INSERT INTO v3_sessions(token_hash,user_id,role,profile_json,expires_at,created_at,last_seen_at) VALUES(?,?,'STUDENT',?,datetime(?),datetime('now'),datetime('now'))`).bind(digest,'1100',JSON.stringify(profile),expires).run();
            return new Response(JSON.stringify({token,expiresAt:expires}),{headers:{'content-type':'application/json','cache-control':'no-store'}});
          }} satisfies ExportedHandler<Env>;
          TS
          PROBE_TOKEN="$PROBE_TOKEN" node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('wrangler.browser-session-probe.json',JSON.stringify({name:'step-progress-v3-browser-session-probe',main:'src/browser-session-probe.ts',compatibility_date:'2026-08-23',compatibility_flags:['nodejs_compat'],vars:{PROBE_TOKEN:process.env.PROBE_TOKEN},d1_databases:[{binding:'DB',database_name:'step-progress-db',database_id:'028f097c-2609-4bf7-9e9b-39b565606941'}]},null,2));
          NODE
          npx wrangler deploy --config wrangler.browser-session-probe.json --message "Temporary protected production browser session probe"
          code=000
          for attempt in $(seq 1 12); do
            code=$(curl --silent --show-error -o /tmp/session.json -w '%{http_code}' -H "Authorization: Bearer $PROBE_TOKEN" https://step-progress-v3-browser-session-probe.stepkobetsu.workers.dev/ || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ] || exit 1
          echo "SESSION_TOKEN=$(node -p "require('/tmp/session.json').token")" >> "$GITHUB_ENV"
          echo "EXPIRES_AT=$(node -p "require('/tmp/session.json').expiresAt")" >> "$GITHUB_ENV"
      - name: Verify current production in real browser
        working-directory: cloudflare
        run: |
          echo "::add-mask::$SESSION_TOKEN"
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true}),page=await browser.newPage(),events=[];
            page.on('pageerror',e=>events.push({type:'pageerror',text:String(e)}));
            page.on('request',req=>{if(req.url().includes('/api')){let action='';try{action=JSON.parse(req.postData()||'{}').action||''}catch{}events.push({type:'request',action,t:Date.now()})}});
            page.on('response',res=>{if(res.url().includes('/api'))events.push({type:'response',status:res.status(),t:Date.now()})});
            await page.goto('https://step-progress-api.stepkobetsu.workers.dev/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.evaluate(({token,expiresAt})=>{const value={token,role:'STUDENT',profile:{studentId:'1100',id:'1100',name:'田中彗翔'},expiresAt};sessionStorage.setItem('fsSession',JSON.stringify(value));localStorage.setItem('forestaProgress.rememberedSession',JSON.stringify(value));localStorage.removeItem('stepCommonStudentSessionToken');localStorage.removeItem('stepCommonStudentSessionExpiresAt')},{token:process.env.SESSION_TOKEN,expiresAt:process.env.EXPIRES_AT});
            const started=Date.now();await page.reload({waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>document.body.innerText.includes('173%'),null,{timeout:8000});
            const elapsed=Date.now()-started;console.log('PRODUCTION_GRAPH='+JSON.stringify({elapsedMs:elapsed,events}));
            const body=await page.locator('body').innerText();if(!body.includes('121/70'))throw new Error('121/70 missing');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify health
        run: |
          curl --fail --silent --show-error https://step-progress-api.stepkobetsu.workers.dev/health -o /tmp/health.json
          cat /tmp/health.json
          node -e 'const h=require("/tmp/health.json");process.exit(h.ok===true&&h.progressCount===3540&&h.targetCount===6555&&h.homeworkCount===2271?0:1)'
