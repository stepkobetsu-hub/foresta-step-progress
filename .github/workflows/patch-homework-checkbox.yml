name: Patch homework done checkbox

on:
  push:
    branches:
      - agent/step-progress-v3-implementation
    paths:
      - .github/workflows/patch-homework-checkbox.yml

permissions:
  contents: write

concurrency:
  group: patch-homework-checkbox-production
  cancel-in-progress: false

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out V3 implementation
        uses: actions/checkout@v4
        with:
          ref: agent/step-progress-v3-implementation

      - name: Replace homework done button with checkbox
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('cloudflare/public/index.html')
          text = path.read_text(encoding='utf-8')
          old = '<button data-home="${id}" data-status="DECLARED_DONE" data-home-type="${type}">やりました</button>'
          new = '<input type="checkbox" class="homeDoneCheckbox" data-home="${id}" data-status="DECLARED_DONE" data-home-type="${type}" aria-label="やりました" title="やりました">'
          if text.count(old) != 1:
              raise SystemExit(f'expected one homework done button target, found {text.count(old)}')
          text = text.replace(old, new, 1)

          css_anchor = '.homeActions button,.smallBtn{min-height:37px;'
          css_rule = '.homeDoneCheckbox{width:22px;height:22px;margin:0;accent-color:var(--green);cursor:pointer;flex:0 0 auto}'
          if css_rule not in text:
              if text.count(css_anchor) != 1:
                  raise SystemExit(f'expected one CSS anchor, found {text.count(css_anchor)}')
              text = text.replace(css_anchor, css_rule + css_anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY
          grep -q 'class="homeDoneCheckbox"' cloudflare/public/index.html

      - name: Commit source patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-homework-checkbox.yml
          git config user.name "stepkobetsu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare/public/index.html .github/workflows/patch-homework-checkbox.yml
          git diff --cached --check
          git commit -m "Use checkbox for homework completion"
          git push origin HEAD:agent/step-progress-v3-implementation

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify TypeScript
        working-directory: cloudflare
        run: npm run check

      - name: Deploy production Worker
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.v3.production.jsonc --message "Use checkbox for homework completion"

      - name: Verify production UI
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            curl --fail --silent --show-error -H 'Cache-Control: no-cache' "https://step-progress-api.stepkobetsu.workers.dev/?v=${GITHUB_SHA}-${attempt}" -o /tmp/index.html
            if grep -q 'class="homeDoneCheckbox"' /tmp/index.html; then
              echo 'homework checkbox is live'
              exit 0
            fi
            sleep 5
          done
          echo 'homework checkbox was not observed in production' >&2
          exit 1
