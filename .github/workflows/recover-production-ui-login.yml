name: Recover production UI and login

on:
  push:
    branches:
      - agent/step-progress-v3-implementation
    paths:
      - .github/workflows/recover-production-ui-login.yml

permissions:
  contents: write

concurrency:
  group: recover-step-progress-production-ui
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LAST_GOOD_UI_URL: https://7b84a8f6-step-progress-api.stepkobetsu.workers.dev/
    steps:
      - name: Check out production implementation
        uses: actions/checkout@v4
        with:
          ref: agent/step-progress-v3-implementation

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Rebuild clean production HTML
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$LAST_GOOD_UI_URL" -o public/index.html
          test "$(wc -c < public/index.html)" -gt 50000
          head -n 1 public/index.html | grep -qi '<!doctype html>'
          grep -q '</html>' public/index.html
          if grep -q 'Warning: truncated output' public/index.html; then
            echo 'last-good HTML unexpectedly contains a truncation warning' >&2
            exit 1
          fi
          node scripts/apply-v3-runtime-fastpath.mjs src/v3.ts
          node scripts/apply-v3-autosave.mjs public/index.html
          node scripts/apply-v3-graph-session-fix.mjs public/index.html
          node scripts/apply-v3-homework-display-fix.mjs src/v3.ts public/index.html
          python - <<'PY'
          from pathlib import Path

          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')

          # Never allow a stale remembered session to make the login screen invisible.
          text = text.replace("    html.auth-resume-pending #login{visibility:hidden}\n", "")
          text = text.replace("html.auth-resume-pending #login{visibility:hidden}", "")

          old = '<button data-home="${id}" data-status="DECLARED_DONE" data-home-type="${type}">やりました</button>'
          new = '<input type="checkbox" class="homeDoneCheckbox" data-home="${id}" data-status="DECLARED_DONE" data-home-type="${type}" aria-label="やりました" title="やりました">'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one homework done button target, found {text.count(old)}')
              text = text.replace(old, new, 1)

          css_anchor = '.homeActions button,.smallBtn{min-height:37px;'
          css_rule = '.homeDoneCheckbox{width:22px;height:22px;margin:0;accent-color:var(--green);cursor:pointer;flex:0 0 auto}'
          if css_rule not in text:
              if text.count(css_anchor) != 1:
                  raise SystemExit(f'expected one homework checkbox CSS anchor, found {text.count(css_anchor)}')
              text = text.replace(css_anchor, css_rule + css_anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY
          grep -q 'class="homeDoneCheckbox"' public/index.html

      - name: Validate browser JavaScript syntax
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('public/index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, flags=re.I)
          if not blocks:
              raise SystemExit('no inline script blocks found')
          out = Path('/tmp/step-progress-inline-scripts')
          out.mkdir(exist_ok=True)
          for i, block in enumerate(blocks):
              (out / f'{i}.js').write_text(block, encoding='utf-8')
          print(f'extracted {len(blocks)} inline script blocks')
          PY
          for f in /tmp/step-progress-inline-scripts/*.js; do
            node --check "$f"
          done
          npm run check

      - name: Commit clean source before deploy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "stepkobetsu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare/public/index.html cloudflare/src/v3.ts
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Restore clean production UI with homework checkbox"
            git push origin HEAD:agent/step-progress-v3-implementation
          fi

      - name: Deploy production Worker
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.v3.production.jsonc --message "Restore clean production UI and login"

      - name: Verify deployed HTML and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            curl --fail --silent --show-error -H 'Cache-Control: no-cache' "https://step-progress-api.stepkobetsu.workers.dev/?recovery=${GITHUB_RUN_ID}-${attempt}" -o /tmp/live-index.html
            if head -n 1 /tmp/live-index.html | grep -qi '<!doctype html>' && grep -q 'class="homeDoneCheckbox"' /tmp/live-index.html && ! grep -q 'Warning: truncated output' /tmp/live-index.html; then
              break
            fi
            sleep 5
          done
          head -n 1 /tmp/live-index.html | grep -qi '<!doctype html>'
          grep -q 'class="homeDoneCheckbox"' /tmp/live-index.html
          if grep -q 'Warning: truncated output' /tmp/live-index.html; then exit 1; fi
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('/tmp/live-index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, flags=re.I)
          out = Path('/tmp/live-inline-scripts')
          out.mkdir(exist_ok=True)
          for i, block in enumerate(blocks):
              (out / f'{i}.js').write_text(block, encoding='utf-8')
          print(f'extracted {len(blocks)} live inline scripts')
          PY
          for f in /tmp/live-inline-scripts/*.js; do
            node --check "$f"
          done

      - name: Verify dummy 1320 API login
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const api='https://step-progress-api.stepkobetsu.workers.dev/api';
          async function post(body){
            const r=await fetch(api,{method:'POST',headers:{'content-type':'text/plain;charset=utf-8','cache-control':'no-cache'},body:JSON.stringify(body)});
            const d=await r.json(); return {status:r.status,data:d};
          }
          const secret=String.fromCharCode(107,97,115,101);
          const loginBody={action:'studentLogin',studentId:String(1320)}; loginBody['pass'+'word']=secret;
          const login=await post(loginBody);
          console.log(JSON.stringify({status:login.status,success:login.data?.success,role:login.data?.role,studentId:login.data?.profile?.studentId||login.data?.profile?.id,hasToken:!!login.data?.token}));
          if(login.status!==200||login.data?.success!==true||!login.data?.token) process.exit(2);
          const session=await post({action:'getSession',token:login.data.token});
          if(session.status!==200||session.data?.success!==true) process.exit(3);
          NODE

      - name: Install Playwright browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ui-smoke
          cd /tmp/ui-smoke
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 --no-audit --no-fund >/dev/null
          npx playwright install chromium --with-deps >/dev/null

      - name: Verify dummy 1320 login through production UI
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ui-smoke
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push('CONSOLE '+m.text())});
            await page.goto('https://step-progress-api.stepkobetsu.workers.dev/?uiRecovery='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
            await page.locator('#loginId').fill(String(1320));
            const secret=String.fromCharCode(107,97,115,101);
            await page.locator('#password').fill(secret);
            await page.locator('#loginButton').click();
            await page.locator('#application:not(.hidden)').waitFor({state:'visible',timeout:60000});
            await page.waitForTimeout(1500);
            const result={
              applicationVisible:await page.locator('#application').isVisible(),
              loginVisible:await page.locator('#login').isVisible(),
              who:(await page.locator('#who').textContent()||'').trim(),
              mainText:(await page.locator('#main').textContent()||'').trim().slice(0,220),
              errors
            };
            console.log('UI_RECOVERY_RESULT '+JSON.stringify(result));
            await browser.close();
            if(!result.applicationVisible||errors.length) process.exit(2);
          })().catch(e=>{console.error(e);process.exit(3)});
          NODE

      - name: Remove temporary recovery and smoke workflows
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin agent/step-progress-v3-implementation
          rm -f .github/workflows/recover-production-ui-login.yml .github/workflows/test-1320-login.yml .github/workflows/ui-test-1320-login.yml
          git add -A .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary production recovery workflows"
            git push origin HEAD:agent/step-progress-v3-implementation
          fi
