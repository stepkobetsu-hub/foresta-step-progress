name: Fix refresh session and graph 20260823

on:
  pull_request:
    branches: [main]
    paths:
      - '.fix-refresh-session-graph-trigger'

permissions:
  contents: read

jobs:
  verify-production-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/homework-status-root-cause
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        working-directory: cloudflare
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Compare production bare and cache-busted HTML
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          curl --fail --silent --show-error -D /tmp/bare.headers https://step-progress-api.stepkobetsu.workers.dev/ -o /tmp/bare.html
          curl --fail --silent --show-error -D /tmp/bust.headers "https://step-progress-api.stepkobetsu.workers.dev/?cb=$stamp" -o /tmp/bust.html
          echo '--- bare headers ---'; cat /tmp/bare.headers
          echo '--- busted headers ---'; cat /tmp/bust.headers
          echo "BARE_SHA=$(sha256sum /tmp/bare.html | cut -d' ' -f1)"
          echo "BUST_SHA=$(sha256sum /tmp/bust.html | cut -d' ' -f1)"
          echo "BARE_STORED_PATCH=$(grep -c 'const storedValid=!!(saved&&saved.token&&saved.profile' /tmp/bare.html || true)"
          echo "BUST_STORED_PATCH=$(grep -c 'const storedValid=!!(saved&&saved.token&&saved.profile' /tmp/bust.html || true)"
          echo "BARE_CACHED_GRAPH_PATCH=$(grep -c 'if(state.dashboardCache)renderProgressHeroFast_(state.dashboardCache);' /tmp/bare.html || true)"
          echo "BUST_CACHED_GRAPH_PATCH=$(grep -c 'if(state.dashboardCache)renderProgressHeroFast_(state.dashboardCache);' /tmp/bust.html || true)"
      - name: Create protected test session
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          PROBE_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$PROBE_TOKEN"
          cat > src/refresh-session-probe.ts <<'TS'
          type Env={DB:D1Database;PROBE_TOKEN:string};
          const hash=async(token:string)=>{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(token));return Array.from(new Uint8Array(d),b=>b.toString(16).padStart(2,'0')).join('')};
          export default {async fetch(req:Request,env:Env){
            const supplied=(req.headers.get('authorization')||'').replace(/^Bearer\s+/i,'');
            if(!env.PROBE_TOKEN||supplied!==env.PROBE_TOKEN)return new Response('not found',{status:404});
            const token=`refresh-1100-${crypto.randomUUID()}-${crypto.randomUUID()}`;
            const digest=await hash(token),expires=new Date(Date.now()+30*60*1000).toISOString();
            const profile={studentId:'1100',id:'1100',name:'田中彗翔'};
            await env.DB.prepare(`INSERT INTO v3_sessions(token_hash,user_id,role,profile_json,expires_at,created_at,last_seen_at) VALUES(?,?,'STUDENT',?,datetime(?),datetime('now'),datetime('now'))`).bind(digest,'1100',JSON.stringify(profile),expires).run();
            return new Response(JSON.stringify({token,expiresAt:expires}),{headers:{'content-type':'application/json','cache-control':'no-store'}});
          }} satisfies ExportedHandler<Env>;
          TS
          PROBE_TOKEN="$PROBE_TOKEN" node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('wrangler.refresh-session-probe.json',JSON.stringify({name:'step-progress-v3-refresh-session-probe',main:'src/refresh-session-probe.ts',compatibility_date:'2026-08-23',compatibility_flags:['nodejs_compat'],vars:{PROBE_TOKEN:process.env.PROBE_TOKEN},d1_databases:[{binding:'DB',database_name:'step-progress-db',database_id:'028f097c-2609-4bf7-9e9b-39b565606941'}]},null,2));
          NODE
          npx wrangler deploy --config wrangler.refresh-session-probe.json --message "Temporary protected refresh cache probe"
          code=000
          for attempt in $(seq 1 12); do
            code=$(curl --silent --show-error -o /tmp/session.json -w '%{http_code}' -H "Authorization: Bearer $PROBE_TOKEN" https://step-progress-v3-refresh-session-probe.stepkobetsu.workers.dev/ || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ] || exit 1
          echo "SESSION_TOKEN=$(node -p "require('/tmp/session.json').token")" >> "$GITHUB_ENV"
          echo "EXPIRES_AT=$(node -p "require('/tmp/session.json').expiresAt")" >> "$GITHUB_ENV"
      - name: Test bare and cache-busted URLs in browser
        working-directory: cloudflare
        run: |
          echo "::add-mask::$SESSION_TOKEN"
          node <<'NODE'
          const {chromium}=require('playwright');
          async function test(url,label){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            await page.evaluate(({token,expiresAt})=>{const v={token,role:'STUDENT',profile:{studentId:'1100',id:'1100',name:'田中彗翔'},expiresAt};sessionStorage.setItem('fsSession',JSON.stringify(v));localStorage.setItem('forestaProgress.rememberedSession',JSON.stringify(v));localStorage.setItem('stepCommonStudentSessionToken','stale-common-token');localStorage.setItem('stepCommonStudentSessionExpiresAt',new Date(Date.now()+3600000).toISOString())},{token:process.env.SESSION_TOKEN,expiresAt:process.env.EXPIRES_AT});
            const times=[];
            for(let i=0;i<2;i++){
              const t=Date.now();await page.reload({waitUntil:'domcontentloaded',timeout:30000});
              try{await page.waitForFunction(()=>document.body.innerText.includes('173%')&&document.body.innerText.includes('121/70'),null,{timeout:8000});times.push(Date.now()-t)}catch(e){times.push(null);console.log(label+'_BODY='+JSON.stringify((await page.locator('body').innerText()).slice(0,1200)));console.log(label+'_ERRORS='+JSON.stringify(errors));break}
            }
            console.log(label+'_TIMES='+JSON.stringify(times));
            await browser.close();
          }
          (async()=>{await test('https://step-progress-api.stepkobetsu.workers.dev/','BARE');await test('https://step-progress-api.stepkobetsu.workers.dev/?cb='+Date.now(),'BUST')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
