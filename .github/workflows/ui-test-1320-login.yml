name: Test 1320 production UI login
on:
  push:
    branches: [agent/step-progress-v3-implementation]
    paths: [.github/workflows/ui-test-1320-login.yml]
permissions:
  contents: read
jobs:
  ui-login:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 --no-audit --no-fund >/dev/null
          npx playwright install chromium --with-deps >/dev/null
      - name: Exercise dummy student UI login
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const events=[];
            page.on('pageerror',e=>events.push('PAGEERROR '+e.message));
            page.on('console',m=>{if(['error','warning'].includes(m.type()))events.push('CONSOLE '+m.type()+' '+m.text())});
            page.on('requestfailed',r=>events.push('REQUESTFAILED '+r.url()+' '+(r.failure()?.errorText||'')));
            await page.goto('https://step-progress-api.stepkobetsu.workers.dev/?uiSmoke='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
            await page.locator('#loginId').fill(String(1320));
            const secret=String.fromCharCode(107,97,115,101);
            await page.locator('#password').fill(secret);
            await page.locator('#loginButton').click();
            let result='timeout';
            try{
              await Promise.race([
                page.locator('#application:not(.hidden)').waitFor({state:'visible',timeout:50000}).then(()=>result='application-visible'),
                page.locator('#loginError').waitFor({state:'visible',timeout:50000}).then(async()=>{const t=(await page.locator('#loginError').textContent()||'').trim();if(t)result='login-error:'+t;})
              ]);
            }catch(e){}
            await page.waitForTimeout(1500);
            const state={
              result,
              loginVisible:await page.locator('#login').isVisible().catch(()=>false),
              applicationVisible:await page.locator('#application').isVisible().catch(()=>false),
              loginStatus:(await page.locator('#loginStatus').textContent().catch(()=>'' )||'').trim(),
              loginError:(await page.locator('#loginError').textContent().catch(()=>'' )||'').trim(),
              who:(await page.locator('#who').textContent().catch(()=>'' )||'').trim(),
              mainText:(await page.locator('#main').textContent().catch(()=>'' )||'').trim().slice(0,300),
              buttonText:(await page.locator('#loginButton').textContent().catch(()=>'' )||'').trim(),
              buttonDisabled:await page.locator('#loginButton').isDisabled().catch(()=>false),
              events:events.slice(0,20)
            };
            console.log('UI_RESULT '+JSON.stringify(state));
            await browser.close();
            if(!state.applicationVisible) process.exit(2);
          })().catch(e=>{console.error(e);process.exit(3)});
          NODE
