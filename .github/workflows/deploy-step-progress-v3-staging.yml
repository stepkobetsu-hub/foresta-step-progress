name: Deploy step-progress V3 staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step-progress-v3-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out isolated V3 implementation
        uses: actions/checkout@v4
        with:
          ref: agent/step-progress-v3-implementation

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Apply V3 runtime save fast path
        working-directory: cloudflare
        run: node scripts/apply-v3-runtime-fastpath.mjs src/v3.ts

      - name: Verify TypeScript
        working-directory: cloudflare
        run: npm run check

      - name: Apply fast autosave UI patch
        working-directory: cloudflare
        run: node scripts/apply-v3-autosave.mjs public/index.html

      - name: Deploy isolated V3 staging Worker
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.v3.template.jsonc --message "V3 isolated D1 autosave staging"

      - name: Bootstrap V3 tables and verify health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://step-progress-v3-staging.stepkobetsu.workers.dev/health | tee /tmp/v3-health.json
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/v3-health.json','utf8'));
          console.log(h);
          if(h.ok!==true || !(h.studentCount>0) || !(h.dummy1320>=1)) process.exit(1);
          NODE

      - name: Create protected smoke helper config
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$SMOKE_TOKEN"
          echo "SMOKE_TOKEN=$SMOKE_TOKEN" >> "$GITHUB_ENV"
          SMOKE_TOKEN="$SMOKE_TOKEN" node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('wrangler.v3-smoke.template.jsonc','utf8'));
          c.vars.SMOKE_TOKEN=process.env.SMOKE_TOKEN;
          fs.writeFileSync('wrangler.v3-smoke.generated.json',JSON.stringify(c,null,2));
          NODE

      - name: Deploy protected 1320 smoke helper
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.v3-smoke.generated.json --message "Temporary protected V3 1320 smoke helper"

      - name: Wait for smoke helper propagation
        run: sleep 4

      - name: Test 1320 progress target and homework saves
        shell: bash
        env:
          SMOKE_TOKEN: ${{ env.SMOKE_TOKEN }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const helper='https://step-progress-v3-smoke.stepkobetsu.workers.dev';
          const api='https://step-progress-v3-staging.stepkobetsu.workers.dev/api';
          const smokeToken=process.env.SMOKE_TOKEN;
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function post(url,body,auth=''){
            const started=performance.now();
            const response=await fetch(url,{method:'POST',headers:{'content-type':'application/json',...(auth?{authorization:`Bearer ${auth}`}:{})},body:JSON.stringify(body)});
            const data=await response.json();
            const wallMs=Math.round(performance.now()-started);
            if(!response.ok)throw new Error(`${url} HTTP ${response.status}: ${JSON.stringify(data)}`);
            return {data,wallMs};
          }
          async function prepareWithRetry(){
            let lastError;
            for(let attempt=1;attempt<=5;attempt++){
              try{return await post(helper,{action:'prepare'},smokeToken)}catch(error){lastError=error;if(attempt<5)await sleep(2000)}
            }
            throw lastError;
          }
          const prepared=await prepareWithRetry();
          if(prepared.data.ok!==true)throw new Error(JSON.stringify(prepared.data));
          const fixture=prepared.data,token=fixture.sessionToken;
          const p=fixture.progress,t=fixture.target,h=fixture.homework;
          const toggledPoint=!Boolean(Number(p.point_confirmed));
          const progress=await post(api,{action:'saveStudentProgressBatch',token,changes:[{unitId:String(p.unit_id),roundNumber:Number(p.round)||1,lctResult:String(p.lct_result||''),pointConfirmed:toggledPoint,warmupConfirmed:Boolean(Number(p.warmup_confirmed)),tryCompleted:Boolean(Number(p.try_completed)),clientRevision:1,clientMutationId:`smoke-progress-${Date.now()}`}]});
          if(progress.data.success!==true||progress.data.results?.[0]?.success!==true)throw new Error(`progress save failed ${JSON.stringify(progress.data)}`);
          if(Number(progress.data.elapsedMs)>=2000)throw new Error(`progress server save too slow: ${progress.data.elapsedMs}ms`);
          const dash1=await post(api,{action:'getStudentDashboard',token});
          const unit=dash1.data.data?.units?.find(x=>String(x.unitId)===String(p.unit_id));
          const round=unit?.rounds?.find(x=>Number(x.roundNumber)===(Number(p.round)||1));
          if(!round||Boolean(round.pointConfirmed)!==toggledPoint)throw new Error('progress did not survive reload');

          const originalTarget=Boolean(Number(t.included)),toggledTarget=!originalTarget;
          const target=await post(api,{action:'setOwnTargetChanges',token,subject:String(t.subject),series:String(t.series),changes:[{unitId:String(t.unit_id),selected:toggledTarget}],clientRevision:1});
          if(target.data.success!==true)throw new Error(`target save failed ${JSON.stringify(target.data)}`);
          if(Number(target.data.elapsedMs)>=2000)throw new Error(`target server save too slow: ${target.data.elapsedMs}ms`);
          const dash2=await post(api,{action:'getStudentDashboard',token});
          const targetUnit=dash2.data.data?.selectableUnits?.find(x=>String(x.unitId)===String(t.unit_id)&&String(x.subject)===String(t.subject)&&String(x.series)===String(t.series));
          if(!targetUnit||Boolean(targetUnit.targetIncluded)!==toggledTarget)throw new Error('target did not survive reload');

          const homework=await post(api,{action:'declareHomework',token,homeworkId:String(h.homework_id),studentStatus:'DECLARED_DONE'});
          if(homework.data.success!==true)throw new Error(`homework save failed ${JSON.stringify(homework.data)}`);
          if(Number(homework.data.elapsedMs)>=2000)throw new Error(`homework server save too slow: ${homework.data.elapsedMs}ms`);
          const inspected=await post(helper,{action:'inspect',progressUnitId:String(p.unit_id),round:Number(p.round)||1,targetUnitId:String(t.unit_id),subject:String(t.subject),series:String(t.series),homeworkId:String(h.homework_id)},smokeToken);
          if(inspected.data.homework?.student_status!=='DECLARED_DONE')throw new Error('homework did not persist in V3 D1');
          if(Boolean(Number(inspected.data.progress?.point_confirmed))!==toggledPoint)throw new Error('progress inspect mismatch');
          if(Boolean(Number(inspected.data.target?.included))!==toggledTarget)throw new Error('target inspect mismatch');
          console.log(JSON.stringify({ok:true,studentId:'1320',progress:{serverMs:Number(progress.data.elapsedMs),wallMs:progress.wallMs},target:{serverMs:Number(target.data.elapsedMs),wallMs:target.wallMs},homework:{serverMs:Number(homework.data.elapsedMs),wallMs:homework.wallMs},reloadVerified:true}));
          NODE

      - name: Final health check
        run: curl --fail --silent --show-error https://step-progress-v3-staging.stepkobetsu.workers.dev/health
