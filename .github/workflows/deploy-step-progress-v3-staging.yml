name: Deploy step-progress V3 staging

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-step-progress-v3-staging.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step-progress-v3-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      V3_DB_NAME: step-progress-v3-db
      SOURCE_DB_NAME: step-progress-db
    steps:
      - name: Check out isolated V3 implementation
        uses: actions/checkout@v4
        with:
          ref: agent/step-progress-v3-implementation

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify TypeScript
        working-directory: cloudflare
        run: npm run check

      - name: Apply fast autosave UI patch
        working-directory: cloudflare
        run: node scripts/apply-v3-autosave.mjs public/index.html

      - name: Find or create V3 D1
        id: d1
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1-list.json
          DB_ID="$(node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));
          const rows=Array.isArray(raw)?raw:(raw.result||[]);
          const row=rows.find(x=>x.name===process.env.V3_DB_NAME);
          process.stdout.write(row ? String(row.uuid||row.id||'') : '');
          NODE
          )"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create "$V3_DB_NAME" --location=apac
            npx wrangler d1 list --json > /tmp/d1-list.json
            DB_ID="$(node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));
          const rows=Array.isArray(raw)?raw:(raw.result||[]);
          const row=rows.find(x=>x.name===process.env.V3_DB_NAME);
          process.stdout.write(row ? String(row.uuid||row.id||'') : '');
          NODE
            )"
          fi
          test -n "$DB_ID"
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Copy current D1 snapshot once
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$V3_DB_NAME" --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name='students';" --json > /tmp/v3-schema.json || true
          if ! grep -q 'students' /tmp/v3-schema.json; then
            npx wrangler d1 export "$SOURCE_DB_NAME" --remote --output=./v3-initial-snapshot.sql
            npx wrangler d1 execute "$V3_DB_NAME" --remote --file=./v3-initial-snapshot.sql --yes
          fi

      - name: Add V3 autosave tables
        working-directory: cloudflare
        run: npx wrangler d1 execute "$V3_DB_NAME" --remote --file=./migrations/0010_v3_fast_autosave.sql --yes

      - name: Confirm migrated data
        working-directory: cloudflare
        run: npx wrangler d1 execute "$V3_DB_NAME" --remote --command "SELECT COUNT(*) AS student_count FROM students; SELECT COUNT(*) AS dummy_1320 FROM students WHERE student_id='1320';" --json

      - name: Generate staging Wrangler config
        working-directory: cloudflare
        env:
          DB_ID: ${{ steps.d1.outputs.db_id }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('wrangler.v3.template.jsonc','utf8'));
          c.d1_databases[0].database_id=process.env.DB_ID;
          fs.writeFileSync('wrangler.v3.generated.json',JSON.stringify(c,null,2));
          NODE

      - name: Deploy V3 staging
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.v3.generated.json --message "V3 D1-first autosave staging"

      - name: Verify staging health
        run: |
          curl --fail --silent --show-error https://step-progress-v3-staging.stepkobetsu.workers.dev/health | tee /tmp/v3-health.json
          node -e "const h=require('/tmp/v3-health.json'); if(h.ok!==true || !(h.studentCount>0)) process.exit(1)"
