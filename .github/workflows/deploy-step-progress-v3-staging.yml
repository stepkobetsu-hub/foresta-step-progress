name: Deploy step-progress V3 staging

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-step-progress-v3-staging.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step-progress-v3-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out isolated V3 implementation
        uses: actions/checkout@v4
        with:
          ref: agent/step-progress-v3-implementation

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify TypeScript
        working-directory: cloudflare
        run: npm run check

      - name: Apply fast autosave UI patch
        working-directory: cloudflare
        run: node scripts/apply-v3-autosave.mjs public/index.html

      - name: Deploy isolated V3 staging Worker
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.v3.template.jsonc --message "V3 isolated D1 autosave staging"

      - name: Bootstrap V3 tables and verify health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://step-progress-v3-staging.stepkobetsu.workers.dev/health | tee /tmp/v3-health.json
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/v3-health.json','utf8'));
          console.log(h);
          if(h.ok!==true || !(h.studentCount>0) || !(h.dummy1320>=1)) process.exit(1);
          NODE
