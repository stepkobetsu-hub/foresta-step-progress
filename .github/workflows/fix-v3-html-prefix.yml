name: Recover V3 production UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .deploy-restored-progress-trigger

permissions:
  contents: read

concurrency:
  group: step-progress-v3-ui-recovery
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LAST_GOOD_UI_URL: https://7b84a8f6-step-progress-api.stepkobetsu.workers.dev/
    steps:
      - name: Check out V3 implementation
        uses: actions/checkout@v4
        with:
          ref: agent/step-progress-v3-implementation
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Prepare production UI and V3 runtime
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$LAST_GOOD_UI_URL" -o public/index.html
          test "$(wc -c < public/index.html)" -gt 50000
          head -n 1 public/index.html | grep -qi '<!doctype html>'
          grep -q '</html>' public/index.html
          node scripts/apply-v3-runtime-fastpath.mjs src/v3.ts
          node scripts/apply-v3-autosave.mjs public/index.html
          node scripts/apply-v3-graph-session-fix.mjs public/index.html
          node scripts/apply-v3-homework-display-fix.mjs src/v3.ts public/index.html
          npm run check
      - name: Deploy V3 production
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.v3.production.jsonc --message "Generate homework from saved lesson progress"
      - name: Verify production UI and health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' https://step-progress-api.stepkobetsu.workers.dev/ -o /tmp/index.html
          grep -q 'renderProgressHeroFast_' /tmp/index.html
          grep -q "main.querySelectorAll('.progressHero')" /tmp/index.html
          if grep -q 'main.textContent.match(/全体進捗/g)' /tmp/index.html; then
            echo 'Old text-based graph dedupe is still present' >&2
            exit 1
          fi
          grep -q 'forestaProgress.manualLogout' /tmp/index.html
          for attempt in {1..12}; do
            curl --fail --silent --show-error -H 'Cache-Control: no-cache' https://step-progress-api.stepkobetsu.workers.dev/health -o /tmp/health.json
            if node -e 'const h=require("/tmp/health.json"); process.exit(h.ok===true && h.mode==="d1-isolated-autosave" && Number(h.generatedHomeworkCount)>0 ? 0 : 1)'; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          cat /tmp/health.json
          exit 1
