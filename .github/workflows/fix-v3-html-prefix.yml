name: Recover V3 production UI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step-progress-v3-ui-recovery
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/trigger-v3-homework-fix'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LAST_GOOD_UI_URL: https://7b84a8f6-step-progress-api.stepkobetsu.workers.dev/
    steps:
      - name: Check out V3 implementation
        uses: actions/checkout@v4
        with:
          ref: agent/step-progress-v3-implementation

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Recover known-good production UI
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$LAST_GOOD_UI_URL" -o /tmp/known-good-index.html
          test "$(wc -c < /tmp/known-good-index.html)" -gt 50000
          head -n 1 /tmp/known-good-index.html | grep -qi '<!doctype html>'
          grep -q '<title>ステップ＆ゴール進捗管理</title>' /tmp/known-good-index.html
          grep -q '</html>' /tmp/known-good-index.html
          cp /tmp/known-good-index.html public/index.html

      - name: Apply V3 autosave homework fix and blank-screen fallback
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-v3-runtime-fastpath.mjs src/v3.ts
          node scripts/apply-v3-autosave.mjs public/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          marker='</head>'
          fallback="<script>setTimeout(function(){document.documentElement.classList.remove('auth-resume-pending');var el=document.getElementById('login');if(el)el.style.visibility='visible';},2500);</script>\n"
          if marker not in s:
              raise SystemExit('head closing tag not found')
          s=s.replace(marker,fallback+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          npm run check
          grep -q 'enabled dynamic student homework IDs' <(node scripts/apply-v3-runtime-fastpath.mjs src/v3.ts 2>&1 || true) || true
          test "$(wc -c < public/index.html)" -gt 50000
          grep -q '</html>' public/index.html

      - name: Deploy homework persistence fix to production
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.v3.production.jsonc --message "Allow current 1320 homework IDs to persist in V3"

      - name: Verify production page and V3 health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' https://step-progress-api.stepkobetsu.workers.dev/ -o /tmp/index.html
          test "$(wc -c < /tmp/index.html)" -gt 50000
          grep -q '</html>' /tmp/index.html
          curl --fail --silent --show-error https://step-progress-api.stepkobetsu.workers.dev/health | tee /tmp/health.json
          node -e 'const h=require("/tmp/health.json"); process.exit(h.ok===true && h.mode==="d1-isolated-autosave" ? 0 : 1)'

      - name: Create protected 1320 session helper
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$SMOKE_TOKEN"
          echo "SMOKE_TOKEN=$SMOKE_TOKEN" >> "$GITHUB_ENV"
          SMOKE_TOKEN="$SMOKE_TOKEN" node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('wrangler.v3-smoke.template.jsonc','utf8'));
          c.vars.SMOKE_TOKEN=process.env.SMOKE_TOKEN;
          fs.writeFileSync('wrangler.v3-smoke.generated.json',JSON.stringify(c,null,2));
          NODE
          npx wrangler deploy --config wrangler.v3-smoke.generated.json --message "Temporary protected 1320 homework persistence test helper"

      - name: Test current 1320 homework check save and reload
        shell: bash
        run: |
          set -euo pipefail
          sleep 4
          node - <<'NODE'
          const helper='https://step-progress-v3-smoke.stepkobetsu.workers.dev';
          const api='https://step-progress-api.stepkobetsu.workers.dev/api';
          const smokeToken=process.env.SMOKE_TOKEN;
          async function post(url,body,auth=''){
            const started=performance.now();
            const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',...(auth?{authorization:`Bearer ${auth}`}:{})},body:JSON.stringify(body)});
            const data=await r.json();
            if(!r.ok) throw new Error(`HTTP ${r.status}: ${JSON.stringify(data)}`);
            return {data,wallMs:Math.round(performance.now()-started)};
          }
          const prepared=await post(helper,{action:'prepare'},smokeToken);
          if(prepared.data.ok!==true) throw new Error(JSON.stringify(prepared.data));
          const token=prepared.data.sessionToken;
          const first=await post(api,{action:'listHomework',token});
          if(first.data.success!==true) throw new Error(`listHomework failed: ${JSON.stringify(first.data)}`);
          const flatten=value=>{
            const flat=Array.isArray(value.homework)?value.homework:[];
            const grouped=Array.isArray(value.groups)?value.groups.flatMap(g=>Array.isArray(g.items)?g.items:[]):[];
            const all=[...flat,...grouped];
            const seen=new Set();
            return all.filter(x=>x&&x.homeworkId&&!seen.has(String(x.homeworkId))&&seen.add(String(x.homeworkId)));
          };
          const items=flatten(first.data);
          const item=items.find(x=>String(x.teacherStatus||'UNCONFIRMED')==='UNCONFIRMED')||items[0];
          if(!item) throw new Error('1320 has no current homework item to test');
          const id=String(item.homeworkId);
          const original=String(item.studentStatus||'UNINPUT');
          const changed=original==='DECLARED_DONE'?'UNINPUT':'DECLARED_DONE';
          const saved=await post(api,{action:'declareHomework',token,homeworkId:id,studentStatus:changed});
          if(saved.data.success!==true) throw new Error(`declareHomework failed: ${JSON.stringify(saved.data)}`);
          if(Number(saved.data.elapsedMs||0)>=2000) throw new Error(`homework save too slow: ${saved.data.elapsedMs}ms`);
          const second=await post(api,{action:'listHomework',token});
          const after=flatten(second.data).find(x=>String(x.homeworkId)===id);
          if(!after||String(after.studentStatus)!==changed) throw new Error(`homework did not survive reload: wanted ${changed}, got ${after?.studentStatus}`);
          const restored=await post(api,{action:'declareHomework',token,homeworkId:id,studentStatus:original});
          if(restored.data.success!==true) throw new Error('homework restore failed');
          const third=await post(api,{action:'listHomework',token});
          const final=flatten(third.data).find(x=>String(x.homeworkId)===id);
          if(!final||String(final.studentStatus)!==original) throw new Error(`homework restore did not survive reload: wanted ${original}, got ${final?.studentStatus}`);
          console.log(JSON.stringify({ok:true,studentId:'1320',homeworkId:id,originalStatus:original,testStatus:changed,serverMs:Number(saved.data.elapsedMs||0),wallMs:saved.wallMs,reloadVerified:true,restored:true}));
          NODE
