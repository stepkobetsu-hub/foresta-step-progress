name: Finalize step-progress V3 snapshot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-step-progress-v3-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step-progress-v3-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out V3 implementation
        uses: actions/checkout@v4
        with:
          ref: agent/step-progress-v3-implementation

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify TypeScript
        working-directory: cloudflare
        run: npm run check

      - name: Create protected finalization helper config
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$SMOKE_TOKEN"
          echo "SMOKE_TOKEN=$SMOKE_TOKEN" >> "$GITHUB_ENV"
          SMOKE_TOKEN="$SMOKE_TOKEN" node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('wrangler.v3-smoke.template.jsonc','utf8'));
          c.vars.SMOKE_TOKEN=process.env.SMOKE_TOKEN;
          fs.writeFileSync('wrangler.v3-smoke.generated.json',JSON.stringify(c,null,2));
          NODE

      - name: Deploy protected finalization helper
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.v3-smoke.generated.json --message "V3 final snapshot helper"

      - name: Wait for helper propagation
        run: sleep 4

      - name: Refresh V3 from current production D1
        shell: bash
        env:
          SMOKE_TOKEN: ${{ env.SMOKE_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $SMOKE_TOKEN" \
            --data '{"action":"finalize"}' \
            https://step-progress-v3-smoke.stepkobetsu.workers.dev \
            | tee /tmp/finalize.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/finalize.json','utf8'));
          if(x.ok!==true || !(x.studentCount>0) || !(x.progressCount>0) || !(x.targetCount>0) || !(x.homeworkCount>0)) process.exit(1);
          console.log('V3 final snapshot:',x);
          NODE

      - name: Verify V3 health after refresh
        run: |
          curl --fail --silent --show-error https://step-progress-v3-staging.stepkobetsu.workers.dev/health | tee /tmp/health.json
          node -e 'const fs=require("fs");const h=JSON.parse(fs.readFileSync("/tmp/health.json","utf8"));if(h.ok!==true)process.exit(1)'
