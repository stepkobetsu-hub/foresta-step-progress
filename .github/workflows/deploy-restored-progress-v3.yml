name: Deploy restored progress V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.deploy-restored-progress-trigger'

permissions:
  contents: read

concurrency:
  group: step-progress-v3-restored-progress
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LAST_GOOD_UI_URL: https://7b84a8f6-step-progress-api.stepkobetsu.workers.dev/
    steps:
      - name: Check out Codex production source
        uses: actions/checkout@v4
        with:
          ref: codex/homework-status-root-cause
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Prepare production source and UI
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$LAST_GOOD_UI_URL" -o public/index.html
          test "$(wc -c < public/index.html)" -gt 50000
          grep -qi '<!doctype html>' public/index.html
          grep -q '</html>' public/index.html
          node scripts/apply-v3-runtime-fastpath.mjs src/v3.ts
          node scripts/apply-v3-autosave.mjs public/index.html
          node scripts/apply-v3-homework-display-fix.mjs src/v3.ts public/index.html
          npm run check
          grep -q 'const unitKey = (row: Row) => text(row.unit_id || row.target_start)' src/summary.ts
          grep -q 'const unitKey = (_subject: unknown, _series: unknown, unitId: unknown) => text(unitId)' src/dashboard.ts
          grep -q 'normalizeTeacherStatus' src/v3.ts
      - name: Deploy V3 production
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.v3.production.jsonc --message "Restore legacy progress and use unit-id aggregation"
      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://step-progress-api.stepkobetsu.workers.dev/health | tee /tmp/health.json
          node -e 'const h=require("/tmp/health.json"); process.exit(h.ok===true && h.mode==="d1-isolated-autosave" ? 0 : 1)'
