name: Deploy restored progress V3

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.deploy-restored-progress-trigger'

permissions:
  contents: read

concurrency:
  group: step-progress-v3-restored-progress
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LAST_GOOD_UI_URL: https://7b84a8f6-step-progress-api.stepkobetsu.workers.dev/
    steps:
      - name: Check out Codex production source
        uses: actions/checkout@v4
        with:
          ref: codex/homework-status-root-cause
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Prepare production source and UI
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$LAST_GOOD_UI_URL" -o public/index.html
          test "$(wc -c < public/index.html)" -gt 50000
          grep -qi '<!doctype html>' public/index.html
          grep -q '</html>' public/index.html
          node scripts/apply-v3-runtime-fastpath.mjs src/v3.ts
          node scripts/apply-v3-autosave.mjs public/index.html
          node scripts/apply-v3-homework-display-fix.mjs src/v3.ts public/index.html
          npm run check
          grep -q 'const unitKey = (row: Row) => text(row.unit_id || row.target_start)' src/summary.ts
          grep -q 'const unitKey = (_subject: unknown, _series: unknown, unitId: unknown) => text(unitId)' src/dashboard.ts
          grep -q 'normalizeTeacherStatus' src/v3.ts
      - name: Deploy V3 production
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.v3.production.jsonc --message "Restore legacy progress and use unit-id aggregation"
      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://step-progress-api.stepkobetsu.workers.dev/health | tee /tmp/health.json
          node -e 'const h=require("/tmp/health.json"); process.exit(h.ok===true && h.mode==="d1-isolated-autosave" && h.progressCount===3540 && h.targetCount===6555 && h.homeworkCount===2271 ? 0 : 1)'
      - name: Verify five legacy screenshot totals through production API
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$VERIFY_TOKEN"
          cat > src/verify-sessions.ts <<'TS'
          type VerifyEnv={DB:D1Database;VERIFY_TOKEN:string};
          const hash=async(token:string)=>{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(token));return Array.from(new Uint8Array(d),b=>b.toString(16).padStart(2,'0')).join('')};
          export default {async fetch(req:Request,env:VerifyEnv){
            const supplied=(req.headers.get('authorization')||'').replace(/^Bearer\s+/i,'');
            if(!env.VERIFY_TOKEN||supplied!==env.VERIFY_TOKEN)return new Response('not found',{status:404});
            const samples=[['1100','田中彗翔',121,70],['1097','上野心美',55,112],['1214','渡辺悠一郎',181,288],['1276','元永祐輔',293,581],['1312','長谷川乃夏',133,420]] as const;
            const out=[];
            for(const [id,name,completed,target] of samples){
              const token=`sample-${id}-${crypto.randomUUID()}-${crypto.randomUUID()}`;
              const digest=await hash(token);
              const expires=new Date(Date.now()+10*60*1000).toISOString();
              await env.DB.prepare(`INSERT INTO v3_sessions(token_hash,user_id,role,profile_json,expires_at,created_at,last_seen_at) VALUES(?,?,'STUDENT',?,datetime(?),datetime('now'),datetime('now')) ON CONFLICT(token_hash) DO UPDATE SET expires_at=excluded.expires_at,last_seen_at=datetime('now')`).bind(digest,id,JSON.stringify({studentId:id,id,name}),expires).run();
              out.push({id,name,token,expectedCompleted:completed,expectedTarget:target});
            }
            return new Response(JSON.stringify({ok:true,samples:out}),{headers:{'content-type':'application/json','cache-control':'no-store'}});
          }} satisfies ExportedHandler<VerifyEnv>;
          TS
          VERIFY_TOKEN="$VERIFY_TOKEN" node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('wrangler.verify-sessions.json',JSON.stringify({
            name:'step-progress-v3-verify-sessions',main:'src/verify-sessions.ts',compatibility_date:'2026-08-22',
            compatibility_flags:['nodejs_compat'],vars:{VERIFY_TOKEN:process.env.VERIFY_TOKEN},
            d1_databases:[{binding:'DB',database_name:'step-progress-db',database_id:'028f097c-2609-4bf7-9e9b-39b565606941'}]
          },null,2));
          NODE
          npx wrangler deploy --config wrangler.verify-sessions.json --message "Temporary protected production sample verifier"
          curl --fail --silent --show-error -H "Authorization: Bearer $VERIFY_TOKEN" https://step-progress-v3-verify-sessions.stepkobetsu.workers.dev/ -o /tmp/sample-sessions.json
          node - <<'NODE'
          const fs=require('fs');
          const prepared=JSON.parse(fs.readFileSync('/tmp/sample-sessions.json','utf8'));
          if(prepared.ok!==true)throw new Error('session preparation failed');
          (async()=>{
            for(const s of prepared.samples){
              const response=await fetch('https://step-progress-api.stepkobetsu.workers.dev/api',{method:'POST',headers:{'content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'getStudentDashboard',token:s.token}),redirect:'follow'});
              const body=await response.text();
              if(!response.ok)throw new Error(`${s.id} production API HTTP ${response.status}: ${body.slice(0,300)}`);
              const data=JSON.parse(body),overall=data?.data?.overall;
              const gotCompleted=Number(overall?.completedCount),gotTarget=Number(overall?.targetCount);
              console.log(`${s.id} ${s.name}: ${gotCompleted}/${gotTarget}`);
              if(gotCompleted!==s.expectedCompleted||gotTarget!==s.expectedTarget)throw new Error(`${s.id} mismatch expected ${s.expectedCompleted}/${s.expectedTarget}`);
            }
            console.log('PRODUCTION_SAMPLE_TOTALS_MATCH=true');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
