name: Apply Goal cross-grade support 20260905

on:
  push:
    branches: ["codex/fix-goal-targets-1320-20260905"]
    paths: [".github/workflows/apply-goal-cross-grade-20260905.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-goal-targets-1320-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/apply_goal_cross_grade.py
      - name: Install Cloudflare dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix cloudflare run check
          npx -y node@24 --test cloudflare/tests/goal-cross-grade-selection.test.mjs cloudflare/tests/dashboard.test.mjs cloudflare/tests/summary.test.mjs cloudflare/tests/v3-homework-generation.test.mjs cloudflare/tests/target-cloud-reliability.test.mjs
          node --check < apps-script/code.gs
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enable Goal for middle school grades"
          git push origin HEAD:codex/fix-goal-targets-1320-20260905
