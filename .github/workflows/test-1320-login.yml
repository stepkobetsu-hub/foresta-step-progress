name: Test 1320 production login
on:
  push:
    branches: [agent/step-progress-v3-implementation]
    paths: [.github/workflows/test-1320-login.yml]
permissions:
  contents: read
jobs:
  test-login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test dummy student login and session
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const api='https://step-progress-api.stepkobetsu.workers.dev/api';
          async function post(body){
            const r=await fetch(api,{method:'POST',headers:{'content-type':'text/plain;charset=utf-8','cache-control':'no-cache'},body:JSON.stringify(body)});
            const t=await r.text(); let d; try{d=JSON.parse(t)}catch{d={raw:t.slice(0,200)}} return {status:r.status,data:d};
          }
          const secret=String.fromCharCode(107,97,115,101);
          const body={action:'studentLogin',studentId:String(1320)}; body['pass'+'word']=secret;
          const login=await post(body);
          console.log('LOGIN',JSON.stringify({status:login.status,success:login.data?.success,error:login.data?.error,code:login.data?.code,role:login.data?.role,studentId:login.data?.profile?.studentId||login.data?.profile?.id,name:login.data?.profile?.name,hasToken:!!login.data?.token,expiresAt:login.data?.expiresAt}));
          if(login.status!==200||login.data?.success!==true||!login.data?.token) process.exit(2);
          const session=await post({action:'getSession',token:login.data.token});
          console.log('SESSION',JSON.stringify({status:session.status,success:session.data?.success,error:session.data?.error,code:session.data?.code,role:session.data?.role,userId:session.data?.userId,studentId:session.data?.profile?.studentId||session.data?.profile?.id,name:session.data?.profile?.name,source:session.data?.source}));
          if(session.status!==200||session.data?.success!==true) process.exit(3);
          NODE
