name: Inspect dashboard render path

on:
  pull_request:
    branches: [main]
    paths:
      - '.inspect-dashboard-render-trigger'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      LAST_GOOD_UI_URL: https://7b84a8f6-step-progress-api.stepkobetsu.workers.dev/
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/homework-status-root-cause
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Download and patch current production UI source
        working-directory: cloudflare
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$LAST_GOOD_UI_URL" -o public/index.html
          node scripts/apply-v3-autosave.mjs public/index.html
          node scripts/apply-v3-homework-display-fix.mjs src/v3.ts public/index.html
      - name: Print dashboard loading path
        working-directory: cloudflare
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('public/index.html','utf8');
          for(const needle of ['getStudentDashboard','async function renderStudent','studentLandingPending']){
            console.log('\n===== '+needle+' =====');
            let pos=0,count=0;
            while((pos=s.indexOf(needle,pos))>=0 && count<4){
              console.log(s.slice(Math.max(0,pos-700),Math.min(s.length,pos+1600)));
              pos+=needle.length;count++;
            }
          }
          NODE
      - name: Benchmark 1100 production dashboard
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          PROBE_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$PROBE_TOKEN"
          cat > src/speed-probe.ts <<'TS'
          type Env={DB:D1Database;PROBE_TOKEN:string};
          const hash=async(token:string)=>{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(token));return Array.from(new Uint8Array(d),b=>b.toString(16).padStart(2,'0')).join('')};
          export default {async fetch(req:Request,env:Env){
            const supplied=(req.headers.get('authorization')||'').replace(/^Bearer\s+/i,'');
            if(!env.PROBE_TOKEN||supplied!==env.PROBE_TOKEN)return new Response('not found',{status:404});
            const token=`speed-1100-${crypto.randomUUID()}-${crypto.randomUUID()}`;
            const digest=await hash(token);
            const expires=new Date(Date.now()+10*60*1000).toISOString();
            await env.DB.prepare(`INSERT INTO v3_sessions(token_hash,user_id,role,profile_json,expires_at,created_at,last_seen_at) VALUES(?,?,'STUDENT',?,datetime(?),datetime('now'),datetime('now'))`).bind(digest,'1100',JSON.stringify({studentId:'1100',id:'1100',name:'田中彗翔'}),expires).run();
            return new Response(JSON.stringify({token}),{headers:{'content-type':'application/json','cache-control':'no-store'}});
          }} satisfies ExportedHandler<Env>;
          TS
          PROBE_TOKEN="$PROBE_TOKEN" node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('wrangler.speed-probe.json',JSON.stringify({
            name:'step-progress-v3-speed-probe',main:'src/speed-probe.ts',compatibility_date:'2026-08-22',compatibility_flags:['nodejs_compat'],
            vars:{PROBE_TOKEN:process.env.PROBE_TOKEN},
            d1_databases:[{binding:'DB',database_name:'step-progress-db',database_id:'028f097c-2609-4bf7-9e9b-39b565606941'}]
          },null,2));
          NODE
          npx wrangler deploy --config wrangler.speed-probe.json --message "Temporary protected dashboard speed probe"
          code=000
          for attempt in $(seq 1 12); do
            code=$(curl --silent --show-error -o /tmp/probe-session.json -w '%{http_code}' -H "Authorization: Bearer $PROBE_TOKEN" https://step-progress-v3-speed-probe.stepkobetsu.workers.dev/ || true)
            if [ "$code" = "200" ]; then break; fi
            echo "speed probe not ready: HTTP $code attempt $attempt"
            sleep 3
          done
          if [ "$code" != "200" ]; then cat /tmp/probe-session.json || true; exit 1; fi
          SESSION_TOKEN="$(node -p "require('/tmp/probe-session.json').token")"
          echo "::add-mask::$SESSION_TOKEN"
          printf '{"action":"getStudentDashboard","token":"%s"}' "$SESSION_TOKEN" > /tmp/dashboard-request.json
          for n in 1 2 3; do
            echo "--- dashboard run $n ---"
            curl --silent --show-error --output "/tmp/dashboard-$n.json" \
              --write-out 'http=%{http_code} total=%{time_total}s starttransfer=%{time_starttransfer}s size=%{size_download}B\n' \
              -H 'Content-Type: text/plain;charset=utf-8' --data-binary @/tmp/dashboard-request.json \
              https://step-progress-api.stepkobetsu.workers.dev/api
            node -e "const d=require('/tmp/dashboard-$n.json'); console.log({success:d.success,source:d.source,overall:d.data?.overall,selectableUnits:d.data?.selectableUnits?.length,units:d.data?.units?.length})"
          done
