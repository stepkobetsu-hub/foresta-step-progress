name: Deploy Goal English 54 recovery 20260905

on:
  push:
    branches: ["agent/step-progress-v3-implementation"]
    paths: [".github/workflows/deploy-goal-english-54-20260905.yml"]

permissions:
  contents: write

concurrency:
  group: goal-english-54-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step-progress-v3-implementation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify code before production
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix cloudflare run check
          npx -y node@24 --test cloudflare/tests/goal-cross-grade-selection.test.mjs cloudflare/tests/goal-english-selfheal.test.mjs cloudflare/tests/dashboard.test.mjs cloudflare/tests/summary.test.mjs cloudflare/tests/v3-homework-generation.test.mjs cloudflare/tests/target-cloud-reliability.test.mjs
          node --check < apps-script/code.gs
          git diff --check
      - name: Deploy production V3 Worker
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.v3.production.jsonc --message "Goal cross-grade + English 54 runtime self-heal"
      - name: Trigger D1 self-heal and verify 1320/1331
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error https://step-progress-api.stepkobetsu.workers.dev/health -o /tmp/health.json; then
              if node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if(h.ok!==true || Number(h.goalEnglishUnitCount)!==54) process.exit(1);
          for(const [id,grade] of [['1320','中2'],['1331','中3']]){
            const s=(h.testStudents||[]).find(x=>String(x.student_id)===id);
            const e=(h.goalEnglishEligibility||[]).find(x=>String(x.student_id)===id);
            if(!s || String(s.grade)!==grade || !e || Number(e.goal_english_count)!==54) process.exit(2);
          }
          NODE
              then ok=1; break; fi
            fi
            sleep 3
          done
          cat /tmp/health.json
          test "$ok" = 1
      - name: Remove one-shot workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/deploy-goal-english-54-20260905.yml
          git commit -m "Remove one-shot Goal English deploy workflow"
          git push origin HEAD:agent/step-progress-v3-implementation
