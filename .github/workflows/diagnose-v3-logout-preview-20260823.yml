name: Diagnose V3 logout preview 20260823

on:
  pull_request:
    branches: [main]
    paths:
      - '.diagnose-v3-logout-preview-trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect explicit logout state
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const events=[];
            page.on('pageerror',error=>events.push({type:'pageerror',text:String(error?.message||error)}));
            page.on('console',msg=>{if(msg.type()==='error')events.push({type:'console-error',text:msg.text()})});
            const url='https://step-progress-v3-logout-hotfix-preview.stepkobetsu.workers.dev/';
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            await page.evaluate(()=>{
              localStorage.setItem('forestaProgress.rememberLogin.staff','true');
              localStorage.setItem('forestaProgress.savedId.staff','diagnostic-teacher');
              localStorage.setItem('forestaProgress.savedPassword.staff','diagnostic-password');
              localStorage.setItem('forestaProgress.loginType','staff');
              localStorage.setItem('forestaProgress.manualLogout','true');
              sessionStorage.removeItem('fsSession');
              localStorage.removeItem('forestaProgress.rememberedSession');
              localStorage.removeItem('stepCommonStudentSessionToken');
              localStorage.removeItem('stepCommonStudentSessionExpiresAt');
            });
            await page.reload({waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(3000);
            const result=await page.evaluate(()=>({
              loginExists:!!document.getElementById('login'),
              loginHidden:document.getElementById('login')?.classList.contains('hidden')??null,
              applicationHidden:document.getElementById('application')?.classList.contains('hidden')??null,
              studentActive:document.getElementById('studentTab')?.classList.contains('active')??null,
              staffActive:document.getElementById('staffTab')?.classList.contains('active')??null,
              title:document.getElementById('loginTitle')?.textContent||null,
              idLabel:document.getElementById('idLabel')?.textContent||null,
              idEmpty:(document.getElementById('loginId')?.value||'')==='',
              markerPresent:localStorage.getItem('forestaProgress.manualLogout')==='true',
              rememberedType:localStorage.getItem('forestaProgress.loginType'),
              storedSessionPresent:!!localStorage.getItem('forestaProgress.rememberedSession'),
              sessionSessionPresent:!!sessionStorage.getItem('fsSession'),
              commonSessionPresent:!!localStorage.getItem('stepCommonStudentSessionToken'),
              hasFinish:typeof finishAuthResume_==='function',
              stateLoginType:typeof state==='object'?state.loginType:null,
              stateRole:typeof state==='object'?state.role:null,
              stateHasToken:typeof state==='object'?!!state.token:null,
              loginInFlight:typeof state==='object'?state.loginInFlight:null
            }));
            console.log('DIAGNOSTIC_STATE='+JSON.stringify(result));
            console.log('DIAGNOSTIC_ERRORS='+JSON.stringify(events));
            await browser.close();
            if(events.length)process.exit(2);
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
