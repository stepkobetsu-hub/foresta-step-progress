  <section id="login" class="login">

<script>
  const HOMEWORK_ENCOURAGEMENTS=['🌟 GOOD!','✨ GREAT!','👏 その調子！','🎉 ナイス！','⭐ よくできました！','💮 ばっちり！','👍 いいね！','🚩 一歩前進！','🏆 すばらしい！','😊 よくがんばったね！'];
  const state={loginType:'student',token:'',role:'',profile:null,loginInFlight:false,studentPage:'homework',studentLandingPending:true,homeworkArchiveView:false,subject:'数学',series:'FORESTA_STEP',vocabularyCache:null,adminPage:'students',adminDetail:'',adminEditing:false,homeworkStudentId:'',settingsOpen:false,targetStudent:'',adminFilters:{campus:'',grade:'',name:'',showActive:true,showInactive:false,homeworkStatus:'',sort:'OVERALL'},adminDashboardPromises:new Map(),dashboardCache:null,homeworkCache:null,pendingSaves:0,unitQueues:new Map(),progressBatchTimer:null,progressBatchInFlight:false,roundByUnit:{},targetQueue:null,loggingOut:false,lifecycleId:0,requestControllers:new Map(),backgroundTimers:new Set()};

  const subjectBadge_=subject=>`<span class="subjectBadge ${subjectClass_(subject)}">${esc(subject)}</span>`;
  const REMEMBER_KEYS={type:'forestaProgress.loginType',student:{enabled:'forestaProgress.rememberLogin.student',id:'forestaProgress.savedId.student',passKey:'forestaProgress.savedPassword.student'},staff:{enabled:'forestaProgress.rememberLogin.staff',id:'forestaProgress.savedId.staff',passKey:'forestaProgress.savedPassword.staff'}};
  const API_URL='https://script.google.com/macros/s/AKfycbwu8lfhiH3_7m4ogHNtbgeo3ehx_VBMnt1mPXsvIlL_kMSpxFdrRD4rO_I6q_JUXIWHmg/exec';

  const SAVE_ACTIONS_=new Set(['saveProgressBatch','saveStudentUnitProgressBatch','saveTargetRange','saveStudentTargetRange','saveHomework','updateHomework']);
  function abortPendingReads_(){state.requestControllers.forEach((action,controller)=>{if(!SAVE_ACTIONS_.has(action)&&action!=='logout')controller.abort()})}

  async function rpc(payload,options={}){
    const attempts=Number(options.attempts||1),timeoutMs=Number(options.timeoutMs||45000),started=performance.now(),lifecycle=state.lifecycleId,action=String(payload?.action||'');
    if(state.loggingOut&&!options.allowDuringLogout)throw new DOMException('ログアウトしました','AbortError');

      const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),timeoutMs);state.requestControllers.set(controller,action);

    }

  }
  async function call(action,data={}){if(state.loggingOut)throw new DOMException('ログアウトしました','AbortError');const lifecycle=state.lifecycleId,result=await rpc({...data,action,token:state.token});if(state.loggingOut||lifecycle!==state.lifecycleId)throw new DOMException('ログアウトしました','AbortError');if(!result.success)throw new Error(result.error||'処理に失敗しました。');return result}
  async function callSlow(action,data={}){if(state.loggingOut)throw new DOMException('ログアウトしました','AbortError');const lifecycle=state.lifecycleId,result=await rpc({...data,action,token:state.token},{attempts:1,timeoutMs:240000});if(state.loggingOut||lifecycle!==state.lifecycleId)throw new DOMException('ログアウトしました','AbortError');if(!result.success)throw new Error(result.error||'処理に失敗しました。');return result}
  function normalizeCampus_(value){const campus=String(value||'').trim().replace(/校$/,'');return campus==='大手町'?'大手':campus}
  function adminListCacheKey_(filters){return 'fsAdminList:v3:'+JSON.stringify({showActive:filters.showActive!==false,showInactive:!!filters.showInactive})}
  function filterAdminStudents_(students,filters){return students.filter(student=>{if(filters.campus&&normalizeCampus_(student.campus)!==normalizeCampus_(filters.campus))return false;if(filters.grade&&student.grade!==filters.grade)return false;if(filters.name&&!String(student.name||'').includes(filters.name))return false;if(filters.homeworkStatus==='UNCONFIRMED'&&!Number(student.unconfirmedHomeworkCount))return false;if(filters.homeworkStatus==='NOT_DONE'&&!Number(student.notDoneHomeworkCount))return false;return true})}
  async function getAdminStudentsFast_(filters){const key=adminListCacheKey_(filters),applyFilters=students=>filterAdminStudents_(students,filters);try{const cached=JSON.parse(sessionStorage.getItem(key)||localStorage.getItem(key)||'null');if(cached&&Date.now()-Number(cached.savedAt)<86400000&&Array.isArray(cached.students))return {students:applyFilters(cached.students),fromCache:true}}catch(error){}const serverFilters={campus:'',grade:'',name:'',homeworkStatus:'',progressStatus:'',showActive:filters.showActive!==false,showInactive:!!filters.showInactive},out=await callSlow('getAdminStudentList',{filters:serverFilters});try{const value=JSON.stringify({savedAt:Date.now(),students:out.students});sessionStorage.setItem(key,value);localStorage.setItem(key,value)}catch(error){}return {...out,students:applyFilters(out.students)}}
  function getAdminDashboardFast_(studentId){const id=String(studentId),key='fsAdminDashboard:'+id;try{const cached=JSON.parse(sessionStorage.getItem(key)||localStorage.getItem(key)||'null');if(cached&&Date.now()-Number(cached.savedAt)<86400000&&cached.data)return Promise.resolve({data:cached.data,fromCache:true})}catch(error){}if(state.adminDashboardPromises.has(id))return state.adminDashboardPromises.get(id);const request=callSlow('getStudentDashboard',{studentId:id}).then(out=>{try{const value=JSON.stringify({savedAt:Date.now(),data:out.data});sessionStorage.setItem(key,value);localStorage.setItem(key,value)}catch(error){}return out}).finally(()=>state.adminDashboardPromises.delete(id));state.adminDashboardPromises.set(id,request);return request}

  function saveNow_(){if(state.progressBatchTimer){clearTimeout(state.progressBatchTimer);state.progressBatchTimer=null;flushProgressBatch_()}const queue=state.targetQueue;if(queue?.timer){clearTimeout(queue.timer);queue.timer=null;queue.flush?.()}}

  function renderStudentTable(rows){
    const f=state.adminFilters,sorted=sortedAdminStudents_(rows,f.sort||'OVERALL');
    $('adminBody').innerHTML=`<section class="card filters adminCompactFilters"><select id="filterCampus"><option value="">校舎：すべて</option><option value="神領" ${normalizeCampus_(f.campus)==='神領'?'selected':''}>神領</option><option value="大手" ${normalizeCampus_(f.campus)==='大手'?'selected':''}>大手</option></select><select id="filterGrade"><option value="">全学年</option>${['中1','中2','中3'].map(g=>`<option ${f.grade===g?'selected':''}>${g}</option>`).join('')}</select><input id="filterName" placeholder="生徒名" value="${esc(f.name)}"><select id="filterHomework"><option value="">宿題状況：すべて</option><option value="UNCONFIRMED" ${f.homeworkStatus==='UNCONFIRMED'?'selected':''}>未確認あり</option><option value="NOT_DONE" ${f.homeworkStatus==='NOT_DONE'?'selected':''}>未実施あり</option></select><select id="sortStudents"><option value="OVERALL" ${(f.sort||'OVERALL')==='OVERALL'?'selected':''}>並び順：全体％</option><option value="NEWEST" ${f.sort==='NEWEST'?'selected':''}>新着（入力）順</option>${['英語','数学','国語','理科','社会'].map(x=>`<option value="SUBJECT_${x}" ${f.sort==='SUBJECT_'+x?'selected':''}>${x}％順</option>`).join('')}<option value="GRADE" ${f.sort==='GRADE'?'selected':''}>学年順</option></select><button id="applyFilters" class="smallBtn">表示を更新</button></section><section class="card"><div class="tableWrap"><table><thead><tr><th>氏名</th><th>学年</th><th>校舎</th><th>全体</th><th>1周目</th>${['英語','数学','国語','理科','社会'].map(x=>`<th class="${subjectClass_(x)}"><span class="subjectLabel">${x}</span></th>`).join('')}<th>未確認</th><th>未実施</th><th>最終入力</th><th></th></tr></thead><tbody>${sorted.map(s=>`<tr><td>${esc(s.name)}${s.gradeConflict?'<span class="badge danger">要確認</span>':''}</td><td>${esc(s.grade)}</td><td>${esc(s.campus)}</td><td>${rateBarHtml_(s.overallRate,s.completedCount,s.targetCount)}</td><td>${pct(s.roundRates?.[1])}</td>${['英語','数学','国語','理科','社会'].map(x=>`<td class="subjectStat ${subjectClass_(x)}">${adminSubjectDisplay_(s,x)}</td>`).join('')}<td>${s.unconfirmedHomeworkCount}</td><td>${s.notDoneHomeworkCount}</td><td>${esc(s.lastStudentInputAt||'—')}</td><td><button class="smallBtn" data-detail="${esc(s.studentId)}">個人画面</button></td></tr>`).join('')}</tbody></table></div><div class="studentCards">${sorted.map(studentCardHtml).join('')||'<div class="empty">該当する生徒はいません</div>'}</div></section>`;
    const apply=()=>{state.adminFilters={...state.adminFilters,campus:$('filterCampus').value,grade:$('filterGrade').value,name:$('filterName').value.trim(),homeworkStatus:$('filterHomework').value,sort:$('sortStudents').value,showActive:state.adminFilters.showActive,showInactive:state.adminFilters.showInactive};showApp()};
    $('applyFilters').onclick=apply;$('sortStudents').onchange=apply;$('filterCampus').onchange=apply;$('filterGrade').onchange=apply;
    document.querySelectorAll('[data-detail]').forEach(button=>{const prefetch=()=>getAdminDashboardFast_(button.dataset.detail).catch(()=>{});button.onpointerenter=prefetch;button.onpointerdown=prefetch;button.onfocus=prefetch;button.onclick=()=>{state.adminDetail=button.dataset.detail;state.adminEditing=false;showApp()}});
  }

  function studentCardHtml(s){return `<article class="studentCard"><h3>${esc(s.name)} ${s.gradeConflict?'<span class="badge danger">要確認</span>':''}</h3><div class="muted">${esc(s.grade)}・${esc(s.campus)}｜最終入力 ${esc(s.lastStudentInputAt||'—')}</div>${rateBarHtml_(s.overallRate,s.completedCount,s.targetCount)}<div class="rateGrid"><div>1周目<b>${pct(s.roundRates?.[1])}</b></div>${['英語','数学','国語','理科','社会'].map(x=>`<div class="subjectRate ${subjectClass_(x)}">${x}<b>${adminSubjectDisplay_(s,x)}</b></div>`).join('')}<div>未確認<b>${s.unconfirmedHomeworkCount}</b></div><div>未実施<b>${s.notDoneHomeworkCount}</b></div></div><button class="smallBtn" data-detail="${esc(s.studentId)}">個人画面を開く</button></article>`}

  function adminRoundHtml_(unit,value,studentId){const needsStudy=value.lctResult==='REVIEW'&&!value.pointConfirmed&&!value.warmupConfirmed&&!value.tryCompleted;return `<article class="compactUnit ${subjectClass_(unit.subject)} ${typeClass_(unit)} ${needsStudy?'needsStudy':''} ${value.tryCompleted?'done':''}" data-unit="${esc(unit.unitId)}" data-round="${value.roundNumber}" data-student="${esc(studentId)}"><span class="unitStep">${esc(unit.stepCode)}</span><span class="unitTitle"><span class="badge">${esc(unit.seriesLabel||seriesInfo_(unit.series).label)}</span> ${esc(unit.unitTitle)}${typeBadge_(unit)}</span><span class="badge">${value.roundNumber}周目</span><span class="lctButtons">${unit.hasLct?[['PERFECT','◎'],['PASS','○'],['REVIEW','×']].map(([v,label])=>`<button type="button" class="lctButton ${value.lctResult===v?'active':''}" data-lct-value="${v}">${label}</button>`).join(''):'<span class="lctLabel">LCTなし</span>'}</span><label class="compactCheck point"><input type="checkbox" data-check="point" ${value.pointConfirmed?'checked':''}><span>Point</span></label><label class="compactCheck wu"><input type="checkbox" data-check="warmup" ${value.warmupConfirmed?'checked':''}><span>WU</span></label><label class="compactCheck try"><input type="checkbox" data-check="try" ${value.tryCompleted?'checked':''}><span>TRY</span></label><span class="learningCell"><span class="learningDate" data-learning-date>${formatShortDate_(value.learningDate)}</span><span class="saveState" data-save-state></span><button type="button" class="retrySave hidden" data-retry-save>再試行</button></span></article>`}
  function adminStudentUnitHtml_(unit,studentId){return unitHtml(unit).replace('data-unit=',`data-student="${esc(studentId)}" data-unit=`)}
  async function renderAdminStudentDashboard_(d,studentId){
    const subjects=d.subjects.map(s=>`<button class="${subjectClass_(s.subject)} ${state.subject===s.subject?'active':''}" data-admin-student-subject="${esc(s.subject)}"><span>${esc(s.subject)}</span><b>${pct(s.progressRate)}</b></button>`).join('');
    const units=d.units.filter(unit=>unit.subject===state.subject&&unit.series===state.series);
    const info=seriesInfo_(state.series),hasLct=units.some(progressHasLct_),required=state.series==='REQUIRED_TEXTBOOK';
    if(!['homework','progress','targets'].includes(state.studentPage))state.studentPage='progress';
    $('adminBody').innerHTML=`${studentWelcomeHtml_(d)}${studentProgressHero_(d)}<div class="viewTabs"><button data-admin-student-page="homework" class="${state.studentPage==='homework'?'active':''}">📚 次回の宿題</button><button data-admin-student-page="progress" class="${state.studentPage==='progress'?'active':''}">✏️ 進捗入力</button><button data-admin-student-page="targets" class="${state.studentPage==='targets'?'active':''}">🎯 目標範囲</button></div><div class="adminSubjectRow"><div class="subjectTabs">${subjects}</div>${state.adminEditing?'':'<span class="adminEditGuide">閲覧専用です。変更する場合は、教科行の右にある「管理者編集」を押してください。</span>'}<button id="adminEditToggle" class="adminEditToggle ${state.adminEditing?'active':''}">${state.adminEditing?'編集を終了':'管理者編集'}</button></div><div id="studentBody"></div>`;
    document.querySelectorAll('[data-admin-student-page]').forEach(button=>button.onclick=()=>{state.studentPage=button.dataset.adminStudentPage;renderAdminStudentDashboard_(d,studentId)});
    $('adminEditToggle').onclick=()=>{state.adminEditing=!state.adminEditing;renderAdminStudentDashboard_(d,studentId)};
    document.querySelectorAll('[data-admin-student-subject]').forEach(button=>button.onclick=()=>{state.subject=button.dataset.adminStudentSubject;if(!d.selectableUnits.some(unit=>unit.subject===state.subject&&unit.series===state.series))state.series='FORESTA_STEP';renderAdminStudentDashboard_(d,studentId)});
    if(state.studentPage==='homework'){
      const home=await call('listHomework',{filters:{studentId}});
      $('studentBody').innerHTML=`<section class="card panel"><div class="panelHead"><div><h2>次回の宿題</h2><p class="muted">管理者として確認状態を変更できます。</p></div><span class="badge warn">未確認 ${home.homework.filter(item=>item.teacherStatus==='UNCONFIRMED').length}件</span></div><div class="homeList">${home.groups.map(reviewGroupHtml_).join('')||'<div class="empty">宿題はありません</div>'}</div></section>`;
      if(state.adminEditing)bindReview(()=>renderAdminStudentDashboard_(d,studentId));else document.querySelectorAll('#studentBody [data-confirm],#studentBody [data-confirm-both],#studentBody textarea').forEach(control=>control.disabled=true);
      return
    }
    $('studentBody').innerHTML=`${materialTabsHtml_(d)}${state.studentPage==='targets'?`<section class="card panel subjectSurface ${subjectClass_(state.subject)}"><div class="panelHead"><div><p class="eyebrow">${esc(info.label)}${esc(state.subject)}</p><h2>目標範囲を選ぶ</h2></div><span class="badge">${units.length}単元</span></div><div class="targetRows">${d.selectableUnits.filter(unit=>unit.subject===state.subject&&unit.series===state.series).map(targetUnitHtml).join('')||'<div class="empty">選択できる単元はありません</div>'}</div></section>`:`<section class="card panel subjectSurface ${subjectClass_(state.subject)}"><div class="panelHead"><div><p class="eyebrow">${esc(info.purpose)}｜${esc(info.label)}${esc(state.subject)}｜選択した目標範囲</p><h2>${required?'必修テキストの進捗':`${hasLct?'LCT・':''}学習チェック`}</h2></div><span class="badge">${units.length}単元</span></div><div class="unitList">${units.map(unit=>adminStudentUnitHtml_(unit,studentId)).join('')||'<div class="empty">目標範囲は未設定です</div>'}</div></section>`}`;
    document.querySelectorAll('[data-series]').forEach(button=>button.onclick=()=>{state.series=button.dataset.series;renderAdminStudentDashboard_(d,studentId)});
    document.querySelectorAll('[data-progress-subject]').forEach(button=>button.onclick=()=>{state.subject=button.dataset.progressSubject;if(!d.units.some(unit=>unit.subject===state.subject&&unit.series===state.series))state.series='FORESTA_STEP';renderAdminStudentDashboard_(d,studentId)});
    if(state.studentPage==='targets')document.querySelectorAll('[data-target-choice]').forEach(input=>{if(!state.adminEditing){input.disabled=true;return}input.onchange=async()=>{input.disabled=true;try{await call('setStudentTarget',{studentId,unitId:input.value,included:input.checked});const unit=d.selectableUnits.find(item=>String(item.unitId)===String(input.value));if(unit)unit.targetIncluded=input.checked;d.units=d.selectableUnits.filter(item=>item.targetIncluded).map(item=>d.units.find(saved=>String(saved.unitId)===String(item.unitId))||item);try{sessionStorage.removeItem('fsAdminDashboard:'+studentId);localStorage.removeItem('fsAdminDashboard:'+studentId)}catch(error){}toast('目標範囲を保存しました');await renderStudentDetail(studentId)}catch(error){input.checked=!input.checked;input.disabled=false;toast(error.message)}}});else if(state.adminEditing)bindUnitAutoSave_(units);else document.querySelectorAll('#studentBody [data-unit] input,#studentBody [data-unit] select,#studentBody [data-unit] .lctButton,#studentBody [data-unit] [data-retry-save]').forEach(control=>control.disabled=true);
  }
  async function renderStudentDetail(studentId){const out=await getAdminDashboardFast_(studentId);const d=out.data;state.dashboardCache=d;if(!d.selectableUnits.some(unit=>unit.subject===state.subject&&unit.series===state.series)){state.subject=d.subjects.find(subject=>Number(subject.targetCount)>0)?.subject||'数学';state.series='FORESTA_STEP'}await renderAdminStudentDashboard_(d,studentId)}

  async function renderStandardRanges(){const out=await call('listUnitMaster');const eligible=out.units.filter(u=>u.standardEligible);const summaries=out.units.filter(u=>u.unitType==='SUMMARY');const preSteps=out.units.filter(u=>u.unitType==='PRE_STEP');$('adminBody').innerHTML=`<section class="card panel"><div class="panelHead"><div><h2>進行表（範囲基準）</h2><p class="muted">標準対象 ${eligible.length}単元｜まとめ ${summaries.length}単元（標準対象）｜プレステップ ${preSteps.length}単元（標準対象外）</p></div></div><div class="unitList">${out.units.map(u=>`<article class="unit ${subjectClass_(u.subject)} ${typeClass_(u)}">${subjectBadge_(u.subject)} <span class="badge">${esc(u.seriesLabel||seriesInfo_(u.series).label)}</span> <b>${esc(u.gradeScope)}｜${esc(u.stepCode)} ${esc(u.unitTitle)} ${typeBadge_(u)}</b><div class="muted">${u.standardEligible?'<span class="badge">標準対象</span>':'<span class="badge danger">標準対象外</span>'}${u.hasLct?'<span class="badge">LCTあり</span>':'<span class="badge">LCTなし</span>'}</div></article>`).join('')}</div></section>`}
  async function renderTargetManager(students){
    const selectedCampus=normalizeCampus_(state.targetCampus||''),selectedGrade=state.targetGrade||'';
    $('adminBody').innerHTML=`<section class="card panel"><div class="panelHead"><div><h2>生徒検索</h2><p class="muted">生徒を検索して、個人画面を開きます。</p></div></div><div class="filters" style="grid-template-columns:minmax(220px,1fr) 150px 150px"><input id="targetSearch" placeholder="名前・IDで検索" value="${esc(state.targetSearch||'')}"><select id="targetCampus"><option value="">全校舎</option><option value="神領" ${selectedCampus==='神領'?'selected':''}>神領</option><option value="大手" ${selectedCampus==='大手'?'selected':''}>大手</option></select><select id="targetGrade"><option value="">全学年</option>${['中1','中2','中3'].map(g=>`<option ${selectedGrade===g?'selected':''}>${g}</option>`).join('')}</select></div><div id="targetResults" class="studentCards" style="display:grid"></div></section>`;
    const visibleStudents=()=>{const query=String(state.targetSearch||'').trim().toLowerCase(),campus=normalizeCampus_(state.targetCampus||''),grade=state.targetGrade||'';return students.filter(s=>(!query||String(s.name||'').toLowerCase().includes(query)||String(s.studentId||'').toLowerCase().includes(query))&&(!campus||normalizeCampus_(s.campus)===campus)&&(!grade||s.grade===grade))};
    const paintResults=()=>{
      $('targetResults').innerHTML=visibleStudents().map(s=>`<article class="studentCard"><h3>${esc(s.name)} <span class="badge">${esc(s.studentId)}</span></h3><div class="muted">${esc(s.grade)}・${esc(s.campus)}</div><button class="smallBtn" data-target-detail="${esc(s.studentId)}">個人画面を開く</button></article>`).join('')||'<div class="empty">該当する生徒はいません</div>';
      document.querySelectorAll('[data-target-detail]').forEach(button=>{const prefetch=()=>getAdminDashboardFast_(button.dataset.targetDetail).catch(()=>{});button.onpointerenter=prefetch;button.onpointerdown=prefetch;button.onfocus=prefetch;button.onclick=()=>{state.adminPage='students';state.adminDetail=button.dataset.targetDetail;state.adminEditing=false;state.studentPage='targets';showApp()}});
    };
    $('targetSearch').oninput=event=>{state.targetSearch=event.target.value;paintResults()};
    $('targetCampus').onchange=event=>{state.targetCampus=event.target.value;paintResults()};
    $('targetGrade').onchange=event=>{state.targetGrade=event.target.value;paintResults()};
    paintResults();
  }
  let initialLoginType='student';try{const savedType=localStorage.getItem(REMEMBER_KEYS.type);if(savedType==='student'||savedType==='staff')initialLoginType=savedType}catch(error){}setLoginType(initialLoginType);
  (async()=>{let resumed=false;const saved=readStoredSession_();try{if(saved&&saved.token&&saved.profile&&(!saved.expiresAt||new Date(saved.expiresAt).getTime()>Date.now())){state.token=saved.token;state.role=saved.role;state.profile=saved.profile;if(saved.role==='STUDENT'){state.studentPage='homework';state.studentLandingPending=true;loadStudentViewCache_()}$('login').classList.add('hidden');$('application').classList.remove('hidden');$('who').textContent=saved.profile?.name||'';if(saved.role==='STUDENT'){if(state.homeworkCache){state.studentLandingPending=false;await renderStudentHomeworkOnly_()}else renderStudentShell_()}else $('main').innerHTML='<section class="card panel"><div class="empty"><p>データを確認しています…</p></div></section>';await call('getSession');resumed=true;await showApp()}}catch(error){clearStoredSession_();state.token='';state.role='';state.profile=null}if(!resumed){const remembered=readRememberedLogin_(state.loginType);if(remembered){restoreRememberedLogin_(state.loginType);$('loginForm').requestSubmit()}else{$('application').classList.add('hidden');$('login').classList.remove('hidden')}}})();
</script>
</body>
</html>
