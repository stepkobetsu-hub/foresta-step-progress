<body>
  <section id="login" class="login">
    <div class="hero"><div class="logo">FS</div><p>個別指導STEP｜2026 夏期講習</p><h1>フォレスタステップ<br>進捗管理</h1><p>学習した単元と宿題を記録し、教室と進み具合を共有します。</p></div>

      <h2 id="loginTitle">生徒ログイン</h2>
      <label class="field"><span id="idLabel">生徒番号</span><input id="loginId" autocomplete="username" required></label>
      <label class="field">パスワード<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" id="loginButton">ログイン</button>
      <div id="loginError" class="error"></div>

    </form></div>

    <header class="top"><div class="brand"><div class="logo">FS</div><span>フォレスタステップ進捗管理【開発】</span></div><div class="topActions"><span id="who" class="muted"></span><button id="logout">ログアウト</button></div></header>

<script>
  const state={loginType:'student',token:'',role:'',profile:null,studentPage:'progress',subject:'数学',adminPage:'students',adminDetail:'',targetStudent:'',adminFilters:{campus:'',grade:'',name:'',showActive:true,showInactive:false,homeworkStatus:''},dashboardCache:null,homeworkCache:null,pendingSaves:0,unitQueues:new Map(),roundByUnit:{},targetQueue:null};
  const $=id=>document.getElementById(id);
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pct=value=>value==null?'—':Math.round(Number(value)*100)+'%';
  const API_URL='https://script.google.com/macros/s/AKfycbwu8lfhiH3_7m4ogHNtbgeo3ehx_VBMnt1mPXsvIlL_kMSpxFdrRD4rO_I6q_JUXIWHmg/exec';
  async function rpc(payload){
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),30000);
    try{
      const response=await fetch(API_URL,{
        method:'POST',

    const saved=new Map(choices.map(input=>[input.value,input.checked]));
    const status=$('targetSaveState');
    const summary=$('selectionSummary');
    const selectedIds=()=>choices.filter(input=>input.checked).map(input=>input.value);
    const paint=()=>{choices.forEach(input=>input.closest('.targetRow').classList.toggle('target',input.checked));document.querySelectorAll('[data-chapter-check]').forEach(box=>{const rows=choices.filter(input=>input.dataset.chapter===box.dataset.chapterCheck);const count=rows.filter(input=>input.checked).length;box.checked=count===rows.length&&rows.length>0;box.indeterminate=count>0&&count<rows.length});const count=selectedIds().length;summary.textContent=`選択 ${count}単元｜未選択 ${choices.length-count}単元`};
    const queue=state.targetQueue={changes:new Map(),revision:0,timer:null,inFlight:false};
    const updateCache=out=>{const d=state.dashboardCache;if(!d)return;const subject=d.subjects.find(item=>item.subject===state.subject);const previous=subject?.targetCount||0;if(subject){subject.targetCount=out.targetCount;subject.progressRate=out.targetCount?subject.completedCount/out.targetCount:null}d.overall.targetCount+=out.targetCount-previous;d.overall.progressRate=d.overall.targetCount?d.overall.completedCount/d.overall.targetCount:null;d.selectableUnits.filter(unit=>unit.subject===state.subject).forEach(unit=>unit.targetIncluded=!!saved.get(String(unit.unitId)));const byId=new Map(d.units.map(unit=>[String(unit.unitId),unit]));d.selectableUnits.filter(unit=>unit.subject===state.subject).forEach(unit=>{const included=!!saved.get(String(unit.unitId));if(included&&!byId.has(String(unit.unitId)))d.units.push({...unit,lctResult:'',pointConfirmed:false,warmupConfirmed:false,tryCompleted:false,learningDate:'',rounds:[1,2,3].map(roundNumber=>({roundNumber,lctResult:'',pointConfirmed:false,warmupConfirmed:false,tryCompleted:false,learningDate:''}))})});d.units=d.units.filter(unit=>unit.subject!==state.subject||saved.get(String(unit.unitId)))};
    const flush=async()=>{
      queue.timer=null;if(queue.inFlight||!queue.changes.size)return;
      queue.inFlight=true;queue.revision+=1;const revision=queue.revision;const sent=new Map(queue.changes);beginSave_();
      status.textContent=`${sent.size}件を保存中…`;status.className='saveState saving';
      try{
        const out=await call('setOwnTargetChanges',{subject:state.subject,changes:Array.from(sent,([unitId,selected])=>({unitId,selected})),clientRevision:revision});
        sent.forEach((selected,unitId)=>{saved.set(unitId,selected);if(queue.changes.get(unitId)===selected)queue.changes.delete(unitId)});
        updateCache(out);status.textContent=`${out.changedCount}件を保存しました（選択${out.targetCount}）`;status.className='saveState';endSave_('すべて保存済み');
      }catch(error){
        sent.forEach((selected,unitId)=>{if(queue.changes.get(unitId)===selected){const input=choices.find(choice=>choice.value===unitId);if(input)input.checked=!!saved.get(unitId);queue.changes.delete(unitId)}});paint();status.textContent='保存に失敗しました';status.className='saveState failed';failSave_();toast(error.message||'保存に失敗しました');
      }finally{
        queue.inFlight=false;if(queue.changes.size){clearTimeout(queue.timer);queue.timer=setTimeout(flush,0)}
      }
    };
    const schedule=(changed,label)=>{changed.forEach(input=>queue.changes.set(input.value,input.checked));paint();status.textContent=`${changed.length}件を保存待ち…`;status.className='saveState saving';setGlobalSave_(`${changed.length}件を保存待ち…`,'saving');clearTimeout(queue.timer);queue.timer=setTimeout(flush,500)};
    choices.forEach(input=>input.onchange=()=>schedule([input],'変更'));
    document.querySelectorAll('[data-chapter-check]').forEach(box=>box.onchange=()=>{const rows=choices.filter(input=>input.dataset.chapter===box.dataset.chapterCheck);rows.forEach(input=>input.checked=box.checked);schedule(rows,'章')});
    document.querySelectorAll('[data-chapter-select]').forEach(button=>button.onclick=()=>{const rows=choices.filter(input=>input.dataset.chapter===button.dataset.chapterSelect);rows.forEach(input=>input.checked=true);schedule(rows,'章')});
    document.querySelectorAll('[data-chapter-clear]').forEach(button=>button.onclick=()=>{const rows=choices.filter(input=>input.dataset.chapter===button.dataset.chapterClear);rows.forEach(input=>input.checked=false);schedule(rows,'章')});
    if(units.length){
      const indexes=choices.map((input,index)=>input.checked?index:-1).filter(index=>index>=0);
      $('rangeStart').value=String(indexes[0]??0);$('rangeEnd').value=String(indexes[indexes.length-1]??units.length-1);
      const changeRange=checked=>{const start=Number($('rangeStart').value),end=Number($('rangeEnd').value),low=Math.min(start,end),high=Math.max(start,end),rows=choices.filter((input,index)=>index>=low&&index<=high);rows.forEach(input=>input.checked=checked);schedule(rows,'範囲')};
      $('applyRange').onclick=()=>changeRange(true);
      $('removeRange').onclick=()=>changeRange(false);
      $('selectAll').onclick=()=>{if(!confirm(`${state.subject}の表示中の全${choices.length}単元を選択しますか？`))return;choices.forEach(input=>input.checked=true);schedule(choices,'全件')};
      $('clearAll').onclick=()=>{if(!confirm(`${state.subject}の表示中の全${choices.length}単元の選択を外しますか？`))return;choices.forEach(input=>input.checked=false);schedule(choices,'全件')};
    }
    paint();
  }

  function homeworkGroupHtml_(group){const redo=homeworkItem_(group,'TRY_REDO'),exercise=homeworkItem_(group,'EXERCISE');const item=item=>{if(!item)return '';const confirmed=item.teacherStatus!=='UNCONFIRMED',noTarget=item.studentStatus==='NO_TARGET_CLAIM'||item.teacherStatus==='NOT_APPLICABLE';if(item.homeworkType==='EXERCISE'&&noTarget)return '';if(!confirmed)return editableHomeworkHtml_(item.homeworkId,item.homeworkType,item.studentStatus,item.studentCompletedDate);const title=item.homeworkType==='TRY_REDO'?'TRY赤×直し':'Exercise',label=item.teacherStatus==='NOT_DONE'?'宿題忘れ':item.teacherStatus==='NOT_APPLICABLE'?'対象なし':'確認済み';return `<div class="homeItem ${item.teacherStatus==='NOT_APPLICABLE'?'noTarget':''}"><b>${title}</b><span class="badge">${label}</span><span class="muted">先生の確認済みです。変更は先生に伝えてください</span></div>`};return `<article class="home" data-home-group="${esc(group.groupKey)}"><div><span class="badge">${esc(group.subject)}</span><span class="badge">${esc(group.roundNumber)}周目</span><h3>${esc(group.stepCode)} ${esc(group.unitTitle||group.unitId)}</h3><p>学習日 ${esc(group.learningDate||'—')}｜宿題日 ${esc(group.assignedDate||'—')}</p></div><div class="homeItems">${item(redo)}${item(exercise)}</div></article>`}
  function paintHomeworkOptimistic_(item,homeworkId,type,status){const today=new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric',timeZone:'Asia/Tokyo'}).format(new Date()),dateParts=today.split('/'),iso=`${new Date().toLocaleString('en-US',{year:'numeric',timeZone:'Asia/Tokyo'})}-${String(dateParts[0]).padStart(2,'0')}-${String(dateParts[1]).padStart(2,'0')}`;item.outerHTML=editableHomeworkHtml_(homeworkId,type,status,status==='DECLARED_DONE'?iso:'')}

  function studentCardHtml(s){return `<article class="studentCard"><h3>${esc(s.name)} ${s.gradeConflict?'<span class="badge danger">要確認</span>':''}</h3><div class="muted">${esc(s.grade)}・${esc(s.campus)}｜最終入力 ${esc(s.lastStudentInputAt||'—')}</div>${rateBarHtml_(s.overallRate,s.completedCount,s.targetCount)}<div class="rateGrid"><div>1周目<b>${pct(s.roundRates?.[1])}</b></div>${['英語','数学','国語','理科','社会'].map(x=>`<div>${x}<b>${pct(s.subjectRates[x])}</b></div>`).join('')}<div>未確認<b>${s.unconfirmedHomeworkCount}</b></div><div>未実施<b>${s.notDoneHomeworkCount}</b></div></div><button class="smallBtn" data-detail="${esc(s.studentId)}">個人詳細</button></article>`}
  function adminRoundHtml_(unit,value,studentId){const needsStudy=value.lctResult==='REVIEW'&&!value.pointConfirmed&&!value.warmupConfirmed&&!value.tryCompleted;return `<article class="compactUnit ${typeClass_(unit)} ${needsStudy?'needsStudy':''} ${value.tryCompleted?'done':''}" data-unit="${esc(unit.unitId)}" data-round="${value.roundNumber}" data-student="${esc(studentId)}"><span class="unitStep">${esc(unit.stepCode)}</span><span class="unitTitle">${esc(unit.unitTitle)}${typeBadge_(unit)}</span><span class="badge">${value.roundNumber}周目</span><span class="lctButtons">${[['PERFECT','◎'],['PASS','○'],['REVIEW','×']].map(([v,label])=>`<button type="button" class="lctButton ${value.lctResult===v?'active':''}" data-lct-value="${v}">${label}</button>`).join('')}</span><label class="compactCheck point"><input type="checkbox" data-check="point" ${value.pointConfirmed?'checked':''}><span>Point</span></label><label class="compactCheck wu"><input type="checkbox" data-check="warmup" ${value.warmupConfirmed?'checked':''}><span>WU</span></label><label class="compactCheck try"><input type="checkbox" data-check="try" ${value.tryCompleted?'checked':''}><span>TRY</span></label><span class="learningCell"><span class="learningDate" data-learning-date>${formatShortDate_(value.learningDate)}</span><span class="saveState" data-save-state></span><button type="button" class="retrySave hidden" data-retry-save>再試行</button></span></article>`}
  async function renderStudentDetail(studentId){const out=await call('getStudentDashboard',{studentId});const d=out.data;state.dashboardCache=d;const outside=d.outsideTargetUnits||[];$('adminBody').innerHTML=`<section class="card panel"><div class="panelHead"><div><p class="eyebrow">生徒個人詳細｜全3周を表示・編集</p><h2>${esc(d.profile.name)}</h2><div class="muted">${esc(d.profile.grade)}・${esc(d.profile.campus)}｜${esc(d.profile.school||'')}</div></div><button id="backStudents" class="smallBtn">一覧へ戻る</button></div><div class="rateGrid"><div>全体<b>${Math.round(Number(d.overall.progressRate||0)*100)}%</b></div>${(d.overall.rounds||[]).map(r=>`<div>${r.roundNumber}周目<b>${pct(r.progressRate)}</b></div>`).join('')}${d.subjects.map(s=>`<div>${esc(s.subject)}<b>${pct(s.progressRate)}</b></div>`).join('')}</div>${['英語','数学','国語','理科','社会'].map(subject=>`<h3>${subject}｜予定 ${d.subjects.find(s=>s.subject===subject)?.targetCount||0}単元</h3><div class="unitList">${d.units.filter(u=>u.subject===subject).flatMap(u=>(u.rounds||[]).map(r=>adminRoundHtml_(u,r,studentId))).join('')||'<div class="empty">予定単元なし</div>'}</div>`).join('')}${outside.length?`<h3>目標外学習（達成率には含みません）</h3><div class="unitList">${outside.flatMap(u=>(u.rounds||[]).map(r=>adminRoundHtml_(u,r,studentId))).join('')}</div>`:''}</section>`;bindUnitAutoSave_(d.units.concat(outside));$('backStudents').onclick=()=>{state.adminDetail='';state.dashboardCache=null;showApp()}}
  async function renderStandardRanges(){const out=await call('listUnitMaster');const eligible=out.units.filter(u=>u.standardEligible);const summaries=out.units.filter(u=>u.unitType==='SUMMARY');const preSteps=out.units.filter(u=>u.unitType==='PRE_STEP');$('adminBody').innerHTML=`<section class="card panel"><div class="panelHead"><div><h2>標準夏期範囲</h2><p class="muted">標準対象 ${eligible.length}単元｜まとめ ${summaries.length}単元（標準対象）｜プレステップ ${preSteps.length}単元（標準対象外）</p></div></div><div class="unitList">${out.units.slice(0,200).map(u=>`<article class="unit ${typeClass_(u)}"><b>${esc(u.subject)}｜${esc(u.gradeScope)}｜${esc(u.stepCode)} ${esc(u.unitTitle)} ${typeBadge_(u)}</b><div class="muted">${u.standardEligible?'<span class="badge">標準対象</span>':'<span class="badge danger">標準対象外</span>'}</div></article>`).join('')}</div></section>`}
  async function renderTargetManager(students){if(!state.targetStudent&&students.length)state.targetStudent=String(students[0].studentId);if(!state.targetStudent){$('adminBody').innerHTML='<section class="card empty">対象生徒がいません</section>';return}const selectedStudent=students.find(s=>String(s.studentId)===state.targetStudent);const [dash,master]=await Promise.all([call('getStudentDashboard',{studentId:state.targetStudent}),call('listUnitMaster')]);const targetIds=new Set(dash.data.units.map(u=>String(u.unitId)));const candidates=master.units.filter(u=>u.gradeScope===selectedStudent?.grade||u.gradeScope==='中1～中3共通');$('adminBody').innerHTML=`<section class="card panel"><div class="panelHead"><div><h2>生徒別目標調整</h2><p class="muted">通常・まとめ・プレステップを生徒ごとに調整できます。既存の個別設定は標準範囲変更後も保持されます。</p></div><select id="targetStudent">${students.map(s=>`<option value="${esc(s.studentId)}" ${String(s.studentId)===state.targetStudent?'selected':''}>${esc(s.name)}（${esc(s.grade)}・${esc(s.campus)}）</option>`).join('')}</select></div><div class="metric"><span>現在の目標</span><b>${dash.data.overall.targetCount}</b></div><div class="unitList" style="margin-top:14px">${candidates.map(u=>{const included=targetIds.has(String(u.unitId));return `<article class="unit ${typeClass_(u)}"><b>${esc(u.subject)}｜${esc(u.stepCode)} ${esc(u.unitTitle)} ${typeBadge_(u)}</b><div class="homeActions"><button data-target-unit="${esc(u.unitId)}" data-included="${included?'false':'true'}">${included?'目標から外す':'目標へ追加'}</button></div></article>`}).join('')}</div></section>`;$('targetStudent').onchange=()=>{state.targetStudent=$('targetStudent').value;showApp()};document.querySelectorAll('[data-target-unit]').forEach(button=>button.onclick=async()=>{await call('setStudentTarget',{studentId:state.targetStudent,unitId:button.dataset.targetUnit,included:button.dataset.included==='true'});toast('生徒別目標を更新しました');showApp()})}
  (async()=>{try{const saved=JSON.parse(sessionStorage.getItem('fsSession')||'null');if(saved&&saved.token&&new Date(saved.expiresAt).getTime()>Date.now()){state.token=saved.token;state.role=saved.role;state.profile=saved.profile;if(saved.role==='STUDENT')state.studentPage='homework';await call('getSession');await showApp()}}catch(error){sessionStorage.removeItem('fsSession')}})();
</script>
</body>
