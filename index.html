  function overdueStudentCard_(student){return `<button type="button" class="overdueStudent" data-overdue-student="${esc(student.studentId)}"><span><span class="overdueName">${esc(student.studentName)}</span>　<span class="badge">${esc(student.grade||'学年未設定')}</span></span><span class="overdueCount">未完了 ${Number(student.overdueCount)}件</span><span><span class="overdueMeta">最古の期限：${esc(formatShortDate_(student.oldestDueDate))}</span><br><span class="overdueMeta">${esc((student.subjects||[]).join('・')||'教科未設定')}｜${esc((student.materials||[]).join('・')||'教材未設定')}</span></span><span>詳細を見る ›</span></button>`}
  function renderOverdueStudentList_(hostId,out){const host=$(hostId);host.innerHTML=`<section class="card panel"><div class="panelHead"><div><h2>宿題未完了の生徒</h2><p class="muted">期限日の翌日以降も未完了の宿題がある生徒</p></div><span class="badge danger">未完了 ${Number(out.totalStudents||0)}名</span></div><div class="overdueList">${(out.students||[]).map(overdueStudentCard_).join('')||'<div class="empty">現在、期限を過ぎた未完了宿題はありません。</div>'}</div></section>`;host.querySelectorAll('[data-overdue-student]').forEach(button=>button.onclick=()=>{state.homeworkStudentId=button.dataset.overdueStudent;showApp()})}
  async function renderOverdueStudentDetail_(hostId,summaries){const host=$(hostId),summary=(summaries||[]).find(item=>String(item.studentId)===String(state.homeworkStudentId)),home=await call('listHomework',{filters:{studentId:state.homeworkStudentId,overdueOnly:true}});host.innerHTML=`<section class="card panel"><div class="panelHead"><div><p class="eyebrow">生徒別宿題ページ</p><h2>${esc(summary?.studentName||state.homeworkStudentId)} ${summary?.grade?`<span class="badge">${esc(summary.grade)}</span>`:''}</h2><p class="muted">期限超過の未完了宿題 ${home.homework.length}件</p></div><button id="backOverdueStudents" class="smallBtn">未完了一覧へ戻る</button></div><div class="homeList">${home.groups.map(reviewGroupHtml_).join('')||'<div class="empty">現在、期限を過ぎた未完了宿題はありません。</div>'}</div></section>`;$('backOverdueStudents').onclick=()=>{state.homeworkStudentId='';showApp()};bindReview(async()=>{const refreshed=await call('listHomework',{filters:{studentId:state.homeworkStudentId,overdueOnly:true}});if(!refreshed.homework.length)state.homeworkStudentId='';await showApp()})}
  async function renderAdmin(){
    const students=await call('getAdminStudentList',{filters:state.adminFilters});
    const settingsPages=['standard','audit','security'],settingsActive=settingsPages.includes(state.adminPage);
    $('main').innerHTML=`<div class="head"><div><p class="eyebrow">管理者画面｜権限レベル2～4</p><h1>全生徒進捗</h1><div class="muted">学習進捗と宿題状況を一覧確認</div></div><div class="metrics"><div class="metric"><span>表示中</span><b>${students.students.length}</b></div></div></div><div class="adminNav"><button data-admin="students" class="${state.adminPage==='students'?'active':''}">全体進捗</button><button data-admin="homework" class="${state.adminPage==='homework'?'active':''}">宿題チェック</button><button data-admin="targets" class="${state.adminPage==='targets'?'active':''}">生徒別目標</button><button data-admin="conflicts" class="${state.adminPage==='conflicts'?'active':''}">学年要確認</button><button data-admin="achievements" class="${state.adminPage==='achievements'?'active':''}">達成履歴</button><button id="settingsToggle" type="button" class="${settingsActive?'active':''}" aria-expanded="${state.settingsOpen?'true':'false'}" aria-controls="adminSettings">設定 ${state.settingsOpen?'▲':'▼'}</button></div><div id="adminSettings" class="adminSettings" ${state.settingsOpen?'':'hidden'}><button data-admin="standard" class="${state.adminPage==='standard'?'active':''}">進行表（範囲基準）</button><button data-admin="audit" class="${state.adminPage==='audit'?'active':''}">総履歴</button><button data-admin="security" class="${state.adminPage==='security'?'active':''}">セキュリティテスト</button></div><div id="adminBody"></div>`;
    $('settingsToggle').onclick=()=>{state.settingsOpen=!state.settingsOpen;const menu=$('adminSettings');menu.hidden=!state.settingsOpen;$('settingsToggle').setAttribute('aria-expanded',String(state.settingsOpen));$('settingsToggle').textContent=`設定 ${state.settingsOpen?'▲':'▼'}`};
    document.querySelectorAll('[data-admin]').forEach(button=>button.onclick=()=>{state.adminPage=button.dataset.admin;state.adminDetail='';state.homeworkStudentId='';showApp()});
    if(state.adminPage==='students'){if(state.adminDetail)await renderStudentDetail(state.adminDetail);else renderStudentTable(students.students)}
    if(state.adminPage==='homework'){const overdue=await call('listOverdueHomeworkStudents');if(state.homeworkStudentId)await renderOverdueStudentDetail_('adminBody',overdue.students);else renderOverdueStudentList_('adminBody',overdue)}
    if(state.adminPage==='standard')await renderStandardRanges();
    if(state.adminPage==='targets')await renderTargetManager(students.students);
    if(state.adminPage==='conflicts'){const out=await call('listGradeConflicts');$('adminBody').innerHTML=`<section class="card panel"><div class="panelHead"><h2>J列・K列 学年不一致</h2></div><div class="unitList">${out.conflicts.map(c=>`<article class="unit"><b>${esc(c.name)}（${esc(c.studentId)}）</b><p>表示：${esc(c.displayGrade)}｜J列：${esc(c.gradeJRaw)}｜K列：${esc(c.gradeKRaw)}</p></article>`).join('')||'<div class="empty">要確認はありません</div>'}</div></section>`}
    if(state.adminPage==='audit'){const out=await call('listAuditLog',{limit:100});$('adminBody').innerHTML=`<section class="card panel"><div class="panelHead"><h2>総履歴</h2></div><div class="history">${out.auditLog.map(a=>`<article class="unit"><b>${esc(a.action)}</b><p>${esc(a.actorRole)}｜${esc(a.actorId)}｜${esc(a.createdAt)}</p></article>`).join('')||'<div class="empty">履歴はありません</div>'}</div></section>`}
    if(state.adminPage==='achievements'){if(!state.targetStudent&&students.students.length)state.targetStudent=String(students.students[0].studentId);const out=state.targetStudent?await call('listAchievementHistory',{studentId:state.targetStudent,limit:100}):{achievements:[]};$('adminBody').innerHTML=`<section class="card panel"><div class="panelHead"><div><h2>達成履歴</h2><p class="muted">年度・全体／科目・節目ごとの初回達成記録</p></div><select id="achievementStudent">${students.students.map(s=>`<option value="${esc(s.studentId)}" ${String(s.studentId)===state.targetStudent?'selected':''}>${esc(s.name)}（${esc(s.grade)}・${esc(s.campus)}）</option>`).join('')}</select></div><div class="history">${out.achievements.map(a=>`<article class="unit ${a.subject?subjectClass_(a.subject):''}"><b>${a.scopeType==='SUBJECT'?subjectBadge_(a.subject):'🏆 全体'} ${Number(a.percent)}％達成</b><p>${esc(a.schoolYear)}年度｜${esc(a.rarity)}｜${esc(a.reachedAt)}</p></article>`).join('')||'<div class="empty">達成履歴はありません</div>'}</div></section>`;if($('achievementStudent'))$('achievementStudent').onchange=()=>{state.targetStudent=$('achievementStudent').value;showApp()}}
    if(state.adminPage==='security'){$('adminBody').innerHTML=`<section class="card panel"><div class="panelHead"><div><h2>Google環境セキュリティテスト</h2><p class="muted">TEST-で始まる開発データだけを使用します。</p></div><button id="runSecurity" class="smallBtn">テストを実行</button></div><div id="securityResults" class="empty">未実行</div></section>`;$('runSecurity').onclick=async()=>{$('runSecurity').disabled=true;$('securityResults').textContent='実行中…';try{const out=await call('runDevelopmentIntegrationTests');$('securityResults').className='history';$('securityResults').innerHTML=`<div class="unit"><b>${out.passed}件成功／${out.failed}件失敗</b><div class="muted">${esc(out.checkedAt)}</div></div>${out.tests.map(t=>`<div class="unit ${t.success?'done':''}"><b>${t.success?'✓':'×'} ${esc(t.name)}</b>${t.detail?`<p class="error">${esc(t.detail)}</p>`:''}</div>`).join('')}`}catch(error){$('securityResults').textContent=error.message}finally{$('runSecurity').disabled=false}}}
  }
  function rateBarHtml_(rate,completed,target,subject=''){const value=Math.round(Number(rate||0)*100),subjectClass=subjectClass_(subject);return `<div class="rateCell ${subjectClass}"><div class="rateCellTop"><b>${value}%</b><span>${completed}/${target}</span></div><div class="adminTrack ${subjectClass}"><i style="width:${Math.min(100,value/3)}%"></i></div></div>`}
  function renderStudentTable(rows){
    const f=state.adminFilters;
    $('adminBody').innerHTML=`<section class="card filters"><input id="filterCampus" placeholder="校舎" value="${esc(f.campus)}"><select id="filterGrade"><option value="">全学年</option>${['中1','中2','中3'].map(g=>`<option ${f.grade===g?'selected':''}>${g}</option>`).join('')}</select><input id="filterName" placeholder="生徒名" value="${esc(f.name)}"><select id="filterHomework"><option value="">宿題状況：すべて</option><option value="UNCONFIRMED" ${f.homeworkStatus==='UNCONFIRMED'?'selected':''}>未確認あり</option><option value="NOT_DONE" ${f.homeworkStatus==='NOT_DONE'?'selected':''}>未実施あり</option></select><button id="applyFilters" class="smallBtn">絞り込む</button><div class="filterChecks"><label><input id="showActive" type="checkbox" ${f.showActive?'checked':''}>在籍生</label><label><input id="showInactive" type="checkbox" ${f.showInactive?'checked':''}>退塾生</label></div></section><section class="card"><div class="tableWrap"><table><thead><tr><th>氏名</th><th>学年</th><th>校舎</th><th>全体</th><th>1周目</th>${['英語','数学','国語','理科','社会'].map(x=>`<th class="${subjectClass_(x)}"><span class="subjectLabel">${x}</span></th>`).join('')}<th>未確認</th><th>未実施</th><th>最終入力</th><th></th></tr></thead><tbody>${rows.map(s=>`<tr><td>${esc(s.name)}${s.gradeConflict?'<span class="badge danger">要確認</span>':''}</td><td>${esc(s.grade)}</td><td>${esc(s.campus)}</td><td>${rateBarHtml_(s.overallRate,s.completedCount,s.targetCount)}</td><td>${pct(s.roundRates?.[1])}</td>${['英語','数学','国語','理科','社会'].map(x=>`<td class="subjectStat ${subjectClass_(x)}">${pct(s.subjectRates[x])}</td>`).join('')}<td>${s.unconfirmedHomeworkCount}</td><td>${s.notDoneHomeworkCount}</td><td>${esc(s.lastStudentInputAt||'—')}</td><td><button class="smallBtn" data-detail="${esc(s.studentId)}">詳細</button></td></tr>`).join('')}</tbody></table></div><div class="studentCards">${rows.map(studentCardHtml).join('')||'<div class="empty">該当する生徒はいません</div>'}</div></section>`;
    $('applyFilters').onclick=()=>{state.adminFilters={campus:$('filterCampus').value.trim(),grade:$('filterGrade').value,name:$('filterName').value.trim(),homeworkStatus:$('filterHomework').value,showActive:$('showActive').checked,showInactive:$('showInactive').checked};showApp()};
    document.querySelectorAll('[data-detail]').forEach(button=>button.onclick=()=>{state.adminDetail=button.dataset.detail;showApp()});
  }
  function studentCardHtml(s){return `<article class="studentCard"><h3>${esc(s.name)} ${s.gradeConflict?'<span class="badge danger">要確認</span>':''}</h3><div class="muted">${esc(s.grade)}・${esc(s.campus)}｜最終入力 ${esc(s.lastStudentInputAt||'—')}</div>${rateBarHtml_(s.overallRate,s.completedCount,s.targetCount)}<div class="rateGrid"><div>1周目<b>${pct(s.roundRates?.[1])}</b></div>${['英語','数学','国語','理科','社会'].map(x=>`<div class="subjectRate ${subjectClass_(x)}">${x}<b>${pct(s.subjectRates[x])}</b></div>`).join('')}<div>未確認<b>${s.unconfirmedHomeworkCount}</b></div><div>未実施<b>${s.notDoneHomeworkCount}</b></div></div><button class="smallBtn" data-detail="${esc(s.studentId)}">個人詳細</button></article>`}
  function adminRoundHtml_(unit,value,studentId){const needsStudy=value.lctResult==='REVIEW'&&!value.pointConfirmed&&!value.warmupConfirmed&&!value.tryCompleted;return `<article class="compactUnit ${subjectClass_(unit.subject)} ${typeClass_(unit)} ${needsStudy?'needsStudy':''} ${value.tryCompleted?'done':''}" data-unit="${esc(unit.unitId)}" data-round="${value.roundNumber}" data-student="${esc(studentId)}"><span class="unitStep">${esc(unit.stepCode)}</span><span class="unitTitle"><span class="badge">${esc(unit.seriesLabel||seriesInfo_(unit.series).label)}</span> ${esc(unit.unitTitle)}${typeBadge_(unit)}</span><span class="badge">${value.roundNumber}周目</span><span class="lctButtons">${unit.hasLct?[['PERFECT','◎'],['PASS','○'],['REVIEW','×']].map(([v,label])=>`<button type="button" class="lctButton ${value.lctResult===v?'active':''}" data-lct-value="${v}">${label}</button>`).join(''):'<span class="lctLabel">LCTなし</span>'}</span><label class="compactCheck point"><input type="checkbox" data-check="point" ${value.pointConfirmed?'checked':''}><span>Point</span></label><label class="compactCheck wu"><input type="checkbox" data-check="warmup" ${value.warmupConfirmed?'checked':''}><span>WU</span></label><label class="compactCheck try"><input type="checkbox" data-check="try" ${value.tryCompleted?'checked':''}><span>TRY</span></label><span class="learningCell"><span class="learningDate" data-learning-date>${formatShortDate_(value.learningDate)}</span><span class="saveState" data-save-state></span><button type="button" class="retrySave hidden" data-retry-save>再試行</button></span></article>`}
  async function renderStudentDetail(studentId){const out=await call('getStudentDashboard',{studentId});const d=out.data;state.dashboardCache=d;const outside=d.outsideTargetUnits||[];$('adminBody').innerHTML=`<section class="card panel"><div class="panelHead"><div><p class="eyebrow">生徒個人詳細｜全3周を表示・編集</p><h2>${esc(d.profile.name)}</h2><div class="muted">${esc(d.profile.grade)}・${esc(d.profile.campus)}｜${esc(d.profile.school||'')}</div></div><button id="backStudents" class="smallBtn">一覧へ戻る</button></div><div class="rateGrid"><div>全体<b>${Math.round(Number(d.overall.progressRate||0)*100)}%</b></div>${(d.overall.rounds||[]).map(r=>`<div>${r.roundNumber}周目<b>${pct(r.progressRate)}</b></div>`).join('')}${d.subjects.map(s=>`<div class="subjectRate ${subjectClass_(s.subject)}">${esc(s.subject)}<b>${pct(s.progressRate)}</b></div>`).join('')}</div>${['英語','数学','国語','理科','社会'].map(subject=>`<h3>${subjectBadge_(subject)} 予定 ${d.subjects.find(s=>s.subject===subject)?.targetCount||0}単元</h3><div class="unitList">${d.units.filter(u=>u.subject===subject).flatMap(u=>(u.rounds||[]).map(r=>adminRoundHtml_(u,r,studentId))).join('')||'<div class="empty">予定単元なし</div>'}</div>`).join('')}${outside.length?`<h3>目標外学習（達成率には含みません）</h3><div class="unitList">${outside.flatMap(u=>(u.rounds||[]).map(r=>adminRoundHtml_(u,r,studentId))).join('')}</div>`:''}</section>`;bindUnitAutoSave_(d.units.concat(outside));$('backStudents').onclick=()=>{state.adminDetail='';state.dashboardCache=null;showApp()}}
  async function renderStandardRanges(){const out=await call('listUnitMaster');const eligible=out.units.filter(u=>u.standardEligible);const summaries=out.units.filter(u=>u.unitType==='SUMMARY');const preSteps=out.units.filter(u=>u.unitType==='PRE_STEP');$('adminBody').innerHTML=`<section class="card panel"><div class="panelHead"><div><h2>進行表（範囲基準）</h2><p class="muted">標準対象 ${eligible.length}単元｜まとめ ${summaries.length}単元（標準対象）｜プレステップ ${preSteps.length}単元（標準対象外）</p></div></div><div class="unitList">${out.units.map(u=>`<article class="unit ${subjectClass_(u.subject)} ${typeClass_(u)}">${subjectBadge_(u.subject)} <span class="badge">${esc(u.seriesLabel||seriesInfo_(u.series).label)}</span> <b>${esc(u.gradeScope)}｜${esc(u.stepCode)} ${esc(u.unitTitle)} ${typeBadge_(u)}</b><div class="muted">${u.standardEligible?'<span class="badge">標準対象</span>':'<span class="badge danger">標準対象外</span>'}${u.hasLct?'<span class="badge">LCTあり</span>':'<span class="badge">LCTなし</span>'}</div></article>`).join('')}</div></section>`}
  async function renderTargetManager(students){if(!state.targetStudent&&students.length)state.targetStudent=String(students[0].studentId);if(!state.targetStudent){$('adminBody').innerHTML='<section class="card empty">対象生徒がいません</section>';return}const selectedStudent=students.find(s=>String(s.studentId)===state.targetStudent);const [dash,master]=await Promise.all([call('getStudentDashboard',{studentId:state.targetStudent}),call('listUnitMaster')]);const targetIds=new Set(dash.data.units.map(u=>String(u.unitId)));const candidates=master.units.filter(u=>u.gradeScope===selectedStudent?.grade||u.gradeScope==='中1～中3共通');$('adminBody').innerHTML=`<section class="card panel"><div class="panelHead"><div><h2>生徒別目標調整</h2><p class="muted">通常・まとめ・プレステップを生徒ごとに調整できます。既存の個別設定は標準範囲変更後も保持されます。</p></div><select id="targetStudent">${students.map(s=>`<option value="${esc(s.studentId)}" ${String(s.studentId)===state.targetStudent?'selected':''}>${esc(s.name)}（${esc(s.grade)}・${esc(s.campus)}）</option>`).join('')}</select></div><div class="metric"><span>現在の目標</span><b>${dash.data.overall.targetCount}</b></div><div class="unitList" style="margin-top:14px">${candidates.map(u=>{const included=targetIds.has(String(u.unitId));return `<article class="unit ${subjectClass_(u.subject)} ${typeClass_(u)}">${subjectBadge_(u.subject)} <b>${esc(u.stepCode)} ${esc(u.unitTitle)} ${typeBadge_(u)}</b><div class="homeActions"><button data-target-unit="${esc(u.unitId)}" data-included="${included?'false':'true'}">${included?'目標から外す':'目標へ追加'}</button></div></article>`}).join('')}</div></section>`;$('targetStudent').onchange=()=>{state.targetStudent=$('targetStudent').value;showApp()};document.querySelectorAll('[data-target-unit]').forEach(button=>button.onclick=async()=>{await call('setStudentTarget',{studentId:state.targetStudent,unitId:button.dataset.targetUnit,included:button.dataset.included==='true'});toast('生徒別目標を更新しました');showApp()})}
  let initialLoginType='student';try{const savedType=localStorage.getItem(REMEMBER_KEYS.type);if(savedType==='student'||savedType==='staff')initialLoginType=savedType}catch(error){}setLoginType(initialLoginType);
  (async()=>{try{const saved=JSON.parse(sessionStorage.getItem('fsSession')||'null');if(saved&&saved.token&&new Date(saved.expiresAt).getTime()>Date.now()){state.token=saved.token;state.role=saved.role;state.profile=saved.profile;if(saved.role==='STUDENT'){state.studentPage='homework';state.studentLandingPending=true}await call('getSession');await showApp()}}catch(error){sessionStorage.removeItem('fsSession')}})();
</script>
</body>
